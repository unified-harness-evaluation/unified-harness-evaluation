image: harness-claude-code
turn_mode: cli
# Harvest the full agent trajectory (tool calls, outputs, reasoning) from the
# Claude Code JSONL transcript in post_run.py and fold it into the saved trace.
# Override per run with the HARNESS_CAPTURE_TRAJECTORY env var on the gateway process.
capture_trajectory: true
# Claude Code refuses --dangerously-skip-permissions as root -> run as coder.
cmd: ["runuser", "-u", "coder", "--", "claude", "-p", "{task}", "--output-format", "text", "--dangerously-skip-permissions"]
env:
  # Point the CLI at the multi-tenant gateway, which proxies /v1/messages to
  # litellm (verified Anthropic-format passthrough -> azure_ai/claude-opus-4-6).
  ANTHROPIC_BASE_URL: "{proxy_base}"
  ANTHROPIC_AUTH_TOKEN: "{api_key}"
  ANTHROPIC_MODEL: "{model}"
  # Small/fast background model also routes through the gateway ("*" wildcard in
  # litellm maps any name to the configured backend).
  ANTHROPIC_SMALL_FAST_MODEL: "{model}"
  DISABLE_AUTOUPDATER: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  CLAUDE_CODE_MAX_OUTPUT_TOKENS: "4096"
  HOME: "/home/coder"
workdir: /workspace
session:
  # Fix the session ID so turn 2+ can --resume it without regex capture.
  turn1_flag: ["--session-id", "00000000-0000-0000-0000-000000000001"]
  flag: ["--resume", "00000000-0000-0000-0000-000000000001"]
  always: true
# global dir: loads unconditionally (project dirs are trust-gated on some CLIs)
skills_dirs:
  - /home/coder/.claude/skills
# init a git repo in the fresh workspace (some CLIs use the git root as
# project boundary or refuse to run outside one)
