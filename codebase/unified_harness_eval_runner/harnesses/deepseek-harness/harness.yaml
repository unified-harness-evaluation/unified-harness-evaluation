image: harness-deepseek-harness
turn_mode: cli
# Harvest the full agent trajectory (tool calls, outputs, reasoning) from dsh's
# zstd-compressed session event log in post_run.py and fold it into the saved
# trace. Override per run with the HARNESS_CAPTURE_TRAJECTORY env var on the
# gateway process.
capture_trajectory: true
cmd: ["dsh", "--profile", "headless", "--patch", "/workspace/.dsh-proxy.yml", "{task}"]
env:
  DEEPSEEK_API_KEY: "{api_key}"
  DEEPSEEK_BASE_URL: "{proxy_base}/v1"
workdir: /workspace
json_extract_final: true
session:
  turn1_flag: "--json"
  always: true
  flag: ["--session-id", "{session_id}"]
  session_id_regex: "\"sessionId\":\"(session-[^\"]+)\""
# global dir: loads unconditionally (project dirs are trust-gated on some CLIs)
skills_dirs:
  - ~/.agents/skills
# init a git repo in the fresh workspace (some CLIs use the git root as
# project boundary or refuse to run outside one)
