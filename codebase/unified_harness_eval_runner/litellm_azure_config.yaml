      model: azure_ai/claude-opus-4-6
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
  - model_name: "gpt-5.4"
    litellm_params:
      model: azure_ai/gpt-5.4
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
  - model_name: "gpt-5.6-sol"
    litellm_params:
      model: azure_ai/gpt-5.6-sol
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
  # Non-OpenAI models are served from the resource's AI-Services inference
  # host (.services.ai.azure.com/models), not the Azure OpenAI host.
  - model_name: "Kimi-K2.6"
    litellm_params:
      model: azure_ai/Kimi-K2.6
      api_base: os.environ/AZURE_AI_API_BASE
      api_key: os.environ/AZURE_AI_API_KEY
  - model_name: "DeepSeek-V4-Flash"
    litellm_params:
      model: azure_ai/DeepSeek-V4-Flash
      api_base: os.environ/AZURE_AI_API_BASE
      api_key: os.environ/AZURE_AI_API_KEY
  - model_name: "grok-4.6"
    litellm_params:
      model: azure_ai/grok-4.6
      api_base: os.environ/AZURE_AI_API_BASE
      api_key: os.environ/AZURE_AI_API_KEY

general_settings:
  drop_params: true
  # Local development only: start without a master key (no auth on the proxy).
  dangerously_permit_weak_or_unset_master_key: true

litellm_settings:
  drop_params: true
  num_retries: 2
  enable_preview_features: false
  modify_params: true
