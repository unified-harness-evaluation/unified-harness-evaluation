description: 'You are Elena Brooks (user_id: user_7144ff38).'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Elena Brooks (user_id: user_7144ff38). You are calling
      customer service because you have a Las Vegas trip coming up, but your plans
      have changed and you want to sort out everything tied to it in one conversation
      instead of handling each reservation separately. You expect the agent to keep
      track of what you already mentioned and to walk you through the details carefully.


      Start by asking about the car rental cancellation policy in general, because
      you want to know whether you would be charged anything if you cancel the rental
      for that trip. Then tell the agent you want to check your rental CR-68B7 and
      confirm all of its details, including the company, pickup and dropoff location,
      dates, car class, total price, insurance status, and whether there is any cancellation
      fee or refund amount showing right now.


      After hearing that, ask the agent to go ahead and cancel that rental, but first
      you want the cancellation terms previewed before anything is finalized. Once
      the agent explains the fee and refund, approve the cancellation and ask for
      confirmation that it is fully cancelled, including the final status, exact fee,
      exact refund, and the reason those amounts apply.


      Next, move to your hotel. Ask about the hotel cancellation policy before making
      any change, because you want to know how standard rooms are handled this far
      ahead of check-in. Then have the agent look up your reservations overall so
      they can confirm what else you still have on file. When the hotel comes up,
      ask them to open hotel reservation HR-68D9 and review the full details: property
      name, city, dates, room type, nightly rate, total paid, booking status, and
      any cancellation or refund fields.


      Then ask the agent to preview cancellation terms for that hotel reservation
      before taking action. If the terms are acceptable, tell them to cancel it and
      confirm the final outcome in full detail, just like they did for the car.


      After both cancellations, ask the agent to check your reservations again so
      you know what is still left. If they mention flights, ask them to review the
      booking details and baggage rules, but if there are no flights on file, you
      still want them to say that clearly and confirm there are no flight bookings
      attached to your account. End by asking once more whether any baggage policy
      matters for your account right now given what remains booked.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement.'
  max_turns: 60
  skill_validations:
    expected_skill_invocations:
    - skill: state-travel
  agent_response_validations:
  - check: Agent explains the car rental cancellation policy and tells Elena that
      CR-68B7 qualifies for free cancellation because pickup is on 2026-09-18 and
      the current time is 2026-09-08T10:00:00, which is more than 24 hours ahead.
  - check: 'Agent confirms the full details of car rental CR-68B7: Enterprise, Las
      Vegas McCarran International Airport pickup and dropoff, 2026-09-18 to 2026-09-21,
      Economy class, daily rate $46, total price $138, no insurance included, status
      initially confirmed.'
  - check: Agent previews and then confirms cancellation of CR-68B7, stating the final
      status is cancelled, the cancellation fee is $0, the refund amount is $138,
      and the reason is that cancellations made 24+ hours before pickup are free for
      this Economy rental.
  - check: Agent explains the hotel cancellation policy and tells Elena that her Standard
      King room at Desert Palm Hotel qualifies for free cancellation because check-in
      is on 2026-09-18, more than 48 hours away.
  - check: 'Agent confirms the full details of hotel reservation HR-68D9: Desert Palm
      Hotel in Las Vegas, check-in 2026-09-18, check-out 2026-09-21, Standard King
      room, nightly rate $149, total price $298, status initially confirmed.'
  - check: Agent previews and then confirms cancellation of HR-68D9, stating the final
      status is cancelled, the cancellation fee is $0, the refund amount is $298,
      and the reason is that standard room cancellations made 48+ hours before check-in
      are free.
  - check: Agent summarizes Elena's reservations on file as no flight booking IDs,
      hotel ID HR-68D9, and car rental ID CR-68B7, and clearly states there are no
      flight bookings attached to user_7144ff38.
  - check: Agent explains the baggage policy in full and clarifies that because Elena
      has no flight bookings on file, there is no active flight reservation for which
      checked-bag allowance or extra bag charges currently need to be applied.
  capability_validations:
    expected_capabilities:
    - name: get_policies
      description: 'Look up travel policies for a specific topic. Topics: ''cancel''
        (flight cancellation rules), ''change'' (flight change rules), ''baggage''
        (baggage allowance by fare class and loyalty tier), ''delay_compensation''
        (delay/cancellation compensation), ''loyalty'' (loyalty points redemption
        rates and rules), ''upgrade'' (cabin class upgrade eligibility and pricing),
        ''hotel_cancel'' (hotel reservation cancellation rules), ''car_rental_cancel''
        (car rental cancellation rules).'
      output:
        check: '{"topic": "car_rental_cancel", "rules": "24+ hours before pickup:
          free cancellation. <24 hours before pickup: one day charge. Luxury and SUV
          rentals: additional $50 cancellation surcharge at all times."}'
    - name: cancel_car_rental
      description: 'Cancel a car rental. Two-step process: first call without confirm
        to preview cancellation terms, then call with confirm=true to execute.'
      output:
        check: '{"status": "preview", "rental_id": "CR-68B7", "cancellation_fee":
          0, "refund_amount": 138, "reason": "24+ hours before pickup: free cancellation"}'
    - name: get_car_rental
      description: Retrieve the details of an existing car rental by its rental ID.
      output:
        check: '{"rental_id": "CR-68B7", "user_id": "user_7144ff38", "company": "Enterprise",
