- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Maya Chen (user_id: user_fa209a3f). You are calling customer
      service because you are trying to sort out several flight-related errands at
      once before a busy stretch of travel, and you want the agent to keep track of
      everything without making you repeat yourself.


      Start by asking about flight FL17A42F for 2026-09-25 because you are considering
      using that route again and want to know whether it is operating normally. Once
      the agent tells you the status, ask them to look for direct SFO to LAS options
      on that same date. You want a clear rundown of the available nonstop flights
      and the economy pricing, and then you want the agent to total the cost for one
      new economy booking so you understand what you would be paying before you commit.


      After that, go ahead and book one of those SFO to LAS flights for yourself using
      your stored Mastercard ending in 9834. You want one adult passenger, economy
      cabin, one checked bag, and no insurance. Once that is done, ask the agent to
      confirm your full customer profile details on file, including payment methods,
      loyalty level, address, and the full list of your reservations.


      Next, return to your existing reservation EC4C1C. Tell the agent you need to
      move that trip to 2026-10-01 but keep it as the same kind of one-way SFO to
      LAS booking in economy. Ask them to search nonstop options for that date, work
      out any price difference, and then update that reservation to the replacement
      flight you choose. After they make the change, ask for the full updated reservation
      details, including itinerary, passengers, baggage, insurance, payment history,
      and current status.


      Once your own travel is sorted, you also want help pricing out other straightforward
      one-way trips. Ask the agent to calculate the total for a JFK to MIA economy
      booking for Sofia Martinez on 2026-10-01, then confirm Sofia’s full customer
      details on file after that booking is created. Then do something similar for
      Elena Park: search direct LAX to LAS flights for 2026-10-01, calculate the economy
      total for the option you choose, book it for her, and then confirm Elena’s full
      profile and reservation list.


      Finally, ask the agent to search direct SEA to SFO flights for 2026-10-05 and
      calculate the economy total for the cheapest option they find, because you want
      to compare one more possible trip before ending the call.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement.'
