      description: Retrieve full product details by exact product ID, including current
        price, stock status, warranty terms, and return window.
      output:
        check: '{"product_id": "PROD-FA349F", "name": "Northline Wool Blend Throw
          Blanket", "category": "home", "subcategory": "blankets", "price": 34, "current_price":
          null, "warranty_months": 12, "return_window_days": 30, "restocking_fee_pct":
          0, "weight_lbs": 0, "is_fragile": 0, "in_stock": 0}'
    - name: process_exchange
      description: 'Exchange an item for a different product or variant. Two-step
        operation: first call without confirm to preview (price difference, eligibility),
        then call with confirm=true to execute. Requires prior call to get_policies(topic=''exchange'').'
      output:
        check: '{"item_id": "ITEM-EEA343", "new_product_id": "PROD-9559B3", "price_difference":
          0, "eligible": true, "status": "preview"}'
