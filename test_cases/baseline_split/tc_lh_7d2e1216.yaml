description: 'You are Lena Brooks (user_id: user_a1bbd117).'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Lena Brooks (user_id: user_a1bbd117). You are contacting
      customer service because you received an order with a few items that no longer
      feel like the right fit, and you want to sort everything out in one conversation
      instead of coming back later.


      Start by asking the agent to pull up product details for the throw blanket from
      your recent order, product ID PROD-FA349F. You want the full details, especially
      the current price, whether it is in stock, the warranty length, and the return
      window, because you are considering whether it is even worth trying to exchange.
      After that, say you want to exchange that blanket for something else and ask
      the agent to look into whether the exchange is possible.


      Then ask the agent to help you find an alternative by searching for a desk organizer.
      Once they show options, ask for full details on the Bamboo Desk Organizer Set,
      and then go ahead with exchanging the blanket for that item if it is allowed.
      Make sure the agent explains any price difference and the final result.


      Next, switch to another item from the same order: ask them to search for wireless
      mouse options because you are also thinking about changing the mouse you bought.
      Have them show you the details for the Wireless Ergonomic Mouse, then ask to
      exchange your original mouse for that one if eligible.


      After that, ask the agent to pull up your order ORD-AC715B so you can review
      everything currently on the order, including shipping, delivery, payment, and
      all items. Then ask them to check the warranty status for the tote bag from
      that order, item ID ITEM-8F1B06, because you remember buying coverage on it
      and want to know whether it is active and what it covers.


      Once that is done, go back to the tote bag and say you are thinking of exchanging
      it for something cheaper. Ask them to search for cable organizer options, then
      get full details for the AeroLoop Silicone Cable Organizer, and process that
      exchange if possible. You want to know exactly what happens to the price difference.


      Finally, ask for one more product search for an insulated travel mug, because
      before ending the chat you want to see another in-stock option you might buy
      separately later.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement.'
  max_turns: 60
  skill_validations:
    expected_skill_invocations:
    - skill: state-customer-support
  agent_response_validations:
  - check: 'Agent confirms the product details for PROD-FA349F: Northline Wool Blend
      Throw Blanket in home/blankets, price $34, current_price null, 12-month warranty,
      30-day return window, 0% restocking fee, and that it is currently out of stock.'
  - check: Agent explains that exchanging ITEM-EEA343 from order ORD-AC715B into PROD-9559B3
      (Bamboo Desk Organizer Set) is eligible, the preview shows a $0 price difference,
      and after confirmation the exchange status is exchanged.
  - check: Agent communicates the wireless mouse search results, including PROD-FA0948
      LogiTech Wireless Mouse M310, PROD-2DBA15 Wireless Ergonomic Mouse, and PROD-7C0240
      Wireless Mouse, all in stock, and confirms PROD-2DBA15 costs $39 with a 12-month
      warranty and 30-day return window.
  - check: Agent tells the user that previewing an exchange of ITEM-74C7E4 to PROD-2DBA15
      is eligible and would require paying a $10 price difference because the original
      mouse was $29 and the replacement is $39, and after confirmation the exchange
      is executed.
  - check: Agent summarizes order ORD-AC715B as delivered, placed on 2026-09-02, shipped
      standard with $0 shipping cost, tracking number CS-TRK-AC715B, delivered on
      2026-09-07T14:30:00 before the promised date of 2026-09-08T12:00:00, with subtotal
      and total paid both $91, and items ITEM-EEA343, ITEM-8F1B06, and ITEM-74C7E4.
  - check: Agent confirms warranty WR-NEW003 on ITEM-8F1B06 is active extended coverage
      from 2026-09-07 through 2028-09-07, with 0 claims used out of 5 maximum, and
      coverage listed as full_replacement.
  - check: 'Agent states the exchange policy before writing actions: exchanges must
      be within the product return window and eligible for return, previews show eligibility
      and price difference, more expensive replacements require customer payment,
      cheaper replacements issue the difference as store credit, and execution requires
      confirmation.'
  - check: Agent reports that exchanging ITEM-8F1B06 for PROD-FCFD98 (AeroLoop Silicone
      Cable Organizer) is eligible with a -$14 price difference meaning $14 would
      be issued as store credit, and after confirmation the exchange is executed;
      the final search also identifies PROD-AFC284 TrailPeak Insulated Travel Mug
      as an in-stock result.
