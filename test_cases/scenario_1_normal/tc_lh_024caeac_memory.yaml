  user_agent:
    task_summary: 'You are Maya Chen (user_id: user_fa209a3f). You are calling customer
      service because you have a whole cluster of travel and shopping-related things
      to sort out in one session, and you expect the agent to keep track of everything
      as the conversation moves around.


      Start by mentioning that you also have a pending retail order under a different
      account you use for store purchases, tied to the email tessa.coleman2026@example.com.
      You want help with that order first: it is order #W3916708, and you want to
      swap both items before it ships. Change the Summit Zip Hoodie from the Forest
      Green medium to the Heather Gray medium, and change the Coastal Breeze Linen
      Shirt from the Sky Blue medium to the White medium. Use the Visa ending in 2284
      for any price difference. Once that is done, ask for the updated full order
      details so you can verify the status, items, shipping address, and payment history.


      Next, shift to a separate support issue and say you also need a refund handled
      for an older delivered order item: item ITEM-E9F653 from order ORD-9497C0. You
      want the agent to process the refund and tell you the amount, method, and any
      breakdown clearly.


      After that, go back to your airline account and ask for a travel certificate
      to be issued as compensation. Then ask the agent to look up direct flights from
      LAX to SFO on 2026-09-20 so you can compare options. Once they give you the
      choices, have them total up a simple fare calculation and then book that LAX
      to SFO trip in economy for you using your saved payment methods, for one passenger:
      Maya Chen, date of birth 1991-04-18. Decline insurance unless asked directly,
      and do not request extra baggage during booking. After booking, ask for the
      full reservation details. Also, before moving on, ask them to quickly confirm
      whether that first retail order is still sitting in the modified pending state
      and which card is attached to it.


      Then pivot to shopping and say you want the agent to search for a wireless mouse,
      and later also search for OXO kitchen items. In between those searches, you
      want three hotel-related actions handled: first book the Seattle option at Maple
      Street Suites, then pull up your existing San Francisco hotel reservation HR-54D4
      so you can confirm its dates and price, then book the Chicago option at Harborview
      Inn, and later also book the Las Vegas option at Desert Palm Hotel. After the
      hotel work, ask the agent to pull your airline profile and then your customer
      service profile so you can confirm what payment methods, membership, balances,
      and reservations are currently on file. After they show you the direct flight
      choices, ask them to remind you which compensation credit they had just issued
      to your airline account and whether it could be used alongside the card for
      the trip you were pricing. Once they give you the fare total, ask them to restate
      which flight and traveler details that total is based on before they finalize
      anything. After they give you the new reservation details, ask them to compare
      it against the flight they had found earlier and confirm it matches the same
      route, day, cabin, and no-add-on setup. When they show the wireless mouse results,
      ask them which of those options is the cheaper one and give the basic details
      again. Right after they pull up that San Francisco hotel stay, ask them to remind
      you which city, dates, room type, and total belong to that existing reservation.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement. Approve code or command from the agent if prompted. After
      the OXO results come back, ask whether the refunded older item is the same one
      that appears in those kitchen search results, and have them confirm the product
      name and refund outcome. After the Chicago hotel booking is done, ask them to
      compare that new booking with the Seattle one from earlier so you can hear both
      hotel names, room types, and totals together. After they show your airline profile
      and then your customer service profile, ask them to tell you again which payment
      methods are on your airline account and which membership tier belongs to that
      separate customer service profile before finishing. Finally, before wrapping
      up, ask them to confirm the details for the Las Vegas hotel they were supposed
      to book at the end, including the hotel name, room type, and total.'
