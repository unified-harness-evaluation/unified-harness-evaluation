id: tc_lh_0af92a2e_memory
description: 'You are Maya Chen (user_id: user_fa209a3f).'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Maya Chen (user_id: user_fa209a3f). You are calling customer
      service because you have a bunch of unrelated travel and shopping errands to
      sort out in one sitting, and you expect the agent to keep track of everything
      as the conversation jumps around.


      Start by asking about your round-trip airline reservation C4C633. You want the
      full details for that booking, including the itinerary, both passengers, how
      many bags are already attached, whether insurance is on it, and the payment
      history. While you are on that reservation, also ask for the current status
      of the outbound flight FLE7F420 on 2026-10-01 so you know whether that segment
      still looks normal.


      Next, update the passenger information on that same round-trip booking without
      changing the number of travelers. Keep two passengers, but make sure the names
      are shown correctly as Maya Lin Chen and Ethan Chen. After that is done, ask
      the agent to confirm the full updated passenger list and all remaining reservation
      details. Also ask the agent to restate the payment method and insurance on that
      first booking so you can make sure those details did not change.


      Then ask to change the flights on that round-trip reservation while keeping
      it as the same round trip and route. You want the outbound to stay on FLE7F420
      on 2026-10-01 and the return to stay on FL84B16B on 2026-10-05 in economy, but
      you still want the agent to process the flight update formally and then confirm
      exactly what is now booked. Once that is settled, go back to that earlier round-trip
      reservation and add one more checked bag. You know bags cannot be removed, only
      added, so ask the agent to confirm the new total baggage count and any extra
      cost.


      After that, switch over to your other booking, EC4C1C, the one-way SFO to LAS
      trip. Ask for the full reservation details for that one too, then check the
      status of flight FL17A42F on 2026-09-16. After reviewing that booking, ask the
      agent to compare its insurance and baggage setup with the first reservation
      you started with.


      You also have a non-airline errand: ask the agent to text Jordan Kim at +1-646-555-0134
      to say, “Running late but still on track for Vegas — I’ll send my final arrival
      details tonight.” If the message can’t be sent right away, you still want it
      resolved and then want confirmation that it was sent. You can also mention that
      if the agent needs to look up Jordan Kim in your contacts first, that is fine.
      Also, once the text is handled, ask the agent to tell you which trip was the
      round trip and which one was the one-way booking.


      Then briefly ask for a product search for an in-stock electronics item under
      $50, and separately ask to review the return policy topic before anything involving
      returns. Finally, you also want to return Jordan Lee’s delivered order #W4669380
      for item 0924077030 to the original card on file, and after that ask for the
      full user details for Jordan Lee so the agent can confirm the profile and payment
      methods connected to that account. Before moving on to the shopping and return
      tasks, ask the agent to confirm which traveler name is attached to the Vegas
      flight.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement. Approve code or command from the agent if prompted. After
      the text message goes through, ask which contact that update was sent to and
      what number was used. After the return policy is explained, ask the agent to
      say whether the shirt return falls under the shorter electronics window or the
      clothing window. At the very end, circle back and ask for a final recap of that
      first airline booking, including the corrected travelers, both flight segments,
      baggage total, insurance, and which card paid for it.'
  max_turns: 60
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Airline
    - skill: toolsandbox-assistant
    - skill: state-shopping
    - skill: state-customer-support
    - skill: tau2Retail
  agent_response_validations:
  - check: 'Agent gives the full details of reservation C4C633: round trip with FLE7F420
      from SEA to SAN on 2026-10-01 and FL84B16B from SAN to SEA on 2026-10-05, economy
      cabin, passengers Maya Chen and Ethan Chen, payment history showing cc_2402ef91
      charged 70, insurance listed as standard, and 2 total / 2 non-free baggages.'
  - check: Agent confirms flight FLE7F420 on 2026-10-01 is available, updates the
      passenger list on C4C633 to show Maya Lin Chen and Ethan Chen without changing
      traveler count, and after the baggage change confirms the reservation now has
      3 total baggages and 3 non-free baggages, with the additional non-free bag costing
      $50 under airline policy.
  - check: Agent confirms the round-trip flight update on C4C633 kept the same two
      segments in economy using payment method cc_2402ef91, then separately provides
      the full details of one-way reservation EC4C1C from SFO to LAS on 2026-09-16
      with one passenger Maya Lin Chen, 1 total / 1 non-free baggage, no insurance,
      payment history showing cc_2402ef91 amount 0, and confirms flight FL17A42F on
      2026-09-16 has status available.
  - check: Agent identifies Jordan Kim in contacts with phone number +1-646-555-0134
      and attempts to send the text message 'Running late but still on track for Vegas
      — I’ll send my final arrival details tonight.' If cellular service is unavailable,
      the agent communicates the issue and works to resolve it; once messaging is
      possible, the agent confirms the message was sent with the returned message
      reference.
  - check: Agent reports the electronics product search results, including PROD-2DBA15
      Wireless Ergonomic Mouse at $39 and PROD-2028EE Magnetic Wireless Charging Stand
      at $45, both in stock.
  - check: Agent explains the return policy for the requested topic, including that
      clothing has a 30-day return window, orders under $50 incur an $8 return shipping
      fee for changed-mind returns, and refunds for delivered-order returns must go
      to the original payment method or an existing gift card.
  - check: 'Agent confirms order #W4669380 for Jordan Lee was eligible because it
      was delivered, that item 0924077030 from the Everyday Crew Tee order was submitted
      for return, and that the order status is now return requested with refund directed
      to mastercard ending in 2714 (credit_card_3045175) and return instructions sent
      by email.'
  - check: 'Agent provides Jordan Lee’s full profile details, including email jordan.lee1989@example.com,
      Denver shipping address at 512 Maple Ave Apt 3B, and both payment methods: credit_card_3045175
      (mastercard ending 2714) and gift_card_5581027 with balance 75.5.'
  capability_validations:
    expected_capabilities:
    - name: get_reservation_details
      description: Fetch the full details of a reservation by its ID, including flights,
        passengers, payment history, baggage, and insurance.
      output:
        check: '{"reservation_id": "C4C633", "user_id": "user_fa209a3f", "origin":
          "SEA", "destination": "SEA", "flight_type": "round_trip", "cabin": "economy",
          "flights": [{"flight_number": "FLE7F420", "origin": "SEA", "destination":
          "SAN", "date": "2026-10-01", "departure_time": "10:10", "arrival_time":
          "13:05"}, {"flight_number": "FL84B16B", "origin": "SAN", "destination":
          "SEA", "date": "2026-10-05", "departure_time": "15:20", "arrival_time":
          "18:15"}], "passengers": [{"first_name": "Maya", "last_name": "Chen", "passenger_type":
          "adult"}, {"first_name": "Ethan", "last_name": "Chen", "passenger_type":
          "adult"}], "payment_history": [{"payment_id": "cc_2402ef91", "amount": 70}],
          "created_at": "2026-09-01T10:00:00", "total_baggages": 2, "nonfree_baggages":
          2, "insurance": "standard", "status": "confirmed"}'
    - name: get_flight_status
      description: Get the status of a flight on a specific date (e.g. 'available',
        'delayed', 'on time', 'flying', 'landed', 'cancelled').
      output:
        check: '{"status": "available"}'
    - name: update_reservation_passengers
      description: Update passenger information on a reservation. The number of passengers
        cannot be changed — must provide the same count as the existing reservation.
      output:
        check: '{"reservation": {"reservation_id": "C4C633", "user_id": "user_fa209a3f",
          "passengers": [{"first_name": "Maya", "middle_name": "Lin", "last_name":
          "Chen", "passenger_type": "adult"}, {"first_name": "Ethan", "last_name":
          "Chen", "passenger_type": "adult"}]}}'
    - name: update_reservation_flights
      description: Update the flights and/or cabin class on a reservation. Pass the
        full new list of flights (including unchanged segments). The API does NOT
        enforce modification rules — the agent must verify eligibility before calling.
      output:
        check: '{"reservation": {"reservation_id": "C4C633", "user_id": "user_fa209a3f",
          "cabin": "economy", "flights": [{"flight_number": "FLE7F420", "origin":
          "SEA", "destination": "SAN", "date": "2026-10-01", "departure_time": "10:10",
          "arrival_time": "13:05"}, {"flight_number": "FL84B16B", "origin": "SAN",
          "destination": "SEA", "date": "2026-10-05", "departure_time": "15:20", "arrival_time":
          "18:15"}]}}'
    - name: update_reservation_baggages
      description: Add baggage to a reservation. Each additional non-free bag costs
        $50. Bags cannot be removed.
      output:
        check: '{"reservation": {"reservation_id": "C4C633", "user_id": "user_fa209a3f",
          "total_baggages": 3, "nonfree_baggages": 3}}'
    - name: get_reservation_details
      description: Fetch the full details of a reservation by its ID, including flights,
        passengers, payment history, baggage, and insurance.
      output:
        check: '{"reservation_id": "EC4C1C", "user_id": "user_fa209a3f", "origin":
          "SFO", "destination": "LAS", "flight_type": "one_way", "cabin": "economy",
          "flights": [{"flight_id": "FL17A42F", "origin": "SFO", "destination": "LAS",
          "date": "2026-09-16", "departure_time": "11:40", "arrival_time": "13:15"}],
          "passengers": [{"first_name": "Maya", "middle_name": "Lin", "last_name":
          "Chen", "passenger_type": "adult"}], "payment_history": [{"payment_id":
          "cc_2402ef91", "amount": 0}], "created_at": "2026-09-01T10:00:00", "total_baggages":
          1, "nonfree_baggages": 1, "insurance": null, "status": "confirmed"}'
    - name: get_flight_status
      description: Get the status of a flight on a specific date (e.g. 'available',
        'delayed', 'on time', 'flying', 'landed', 'cancelled').
      output:
        check: '{"status": "available"}'
    - name: search_contacts
      description: Search for contacts based on provided criteria. Name and relationship
        are fuzzy-matched (threshold 90); person_id, phone_number, and is_self are
        exact-matched. Returns at most top 5 fuzzy matches. Requires at least one
        criterion.
      output:
        check: '{"result": [{"person_id": "0d962e01-b007-4e86-88c1-cf6b43282b3e",
          "name": "Jordan Kim", "phone_number": "+1-646-555-0134", "relationship":
          "friend", "is_self": 0, "created_at": "2026-09-01T10:00:00"}]}'
    - name: send_message_with_phone_number
      description: Send a text message to a recipient using their phone number. Requires
        cellular service ON (ConnectionError otherwise) and exactly one self-contact
        (DuplicateError otherwise). Recipient need not be in contacts.
      output:
        check: '{"message_id": "newly generated message ID"}'
    - name: search_products
      description: Search the product catalog. Returns up to 10 ranked products. Hard
        filters (category, price range, rating, in_stock_only) narrow the candidate
        pool; products failing a hard filter are excluded. `query` soft-ranks survivors
        by matching against product name, brand, subcategory, description, and spec
        keys/values. If query matches nothing, returns no products with a note.
      output:
        check: '{"products": [{"product_id": "PROD-2DBA15", "name": "Wireless Ergonomic
          Mouse", "category": "electronics", "subcategory": "computer accessories",
          "brand": "Northfield Tech", "price": 39, "in_stock": 1, "stock_quantity":
          84, "rating": 3.2}, {"product_id": "PROD-2028EE", "name": "Magnetic Wireless
          Charging Stand", "category": "electronics", "subcategory": "Mobile Accessories",
          "brand": "VoltForge", "price": 45, "in_stock": 1, "stock_quantity": 96,
          "rating": 3.9}], "total_found": 2, "note": ""}'
    - name: get_policies
      description: 'Look up the company''s policies for a given topic. IMPORTANT:
        Must be called before using any write tool (process_return, process_refund,
        cancel_order, process_exchange, process_warranty_claim). The system will reject
        write operations if the relevant policy has not been reviewed first.'
      output:
        check: '{"topic": "return", "rules": "Return windows by category: electronics
          15 days, clothing 30 days, kitchen 30 days, books 14 days, accessories 30
          days. Window extensions: Gold/Platinum members get +15 days; Prime shipping
          members get +15 additional days (stacks with tier). Seasonal extension:
          orders placed in November or December extend through January 31 of the following
          year (applies if it gives more time than tier/prime extensions). Store-credit
          grace: up to 15 days past the return window, store credit only. Eligibility:
          defective, wrong item, or damaged in transit have no window restriction;
          items already returned/exchanged/cancelled are ineligible. not_as_described
          is only for unused/unworn items that materially differ from the listing;
          if the customer wore, washed, altered, or used the item and dislikes fit/feel/texture/preference,
          classify as changed_mind. Restocking fee: 15% for opened electronics returned
          for changed_mind. Tier discounts on restocking: Platinum fully waived, Gold
          50% off, Silver 25% off, Standard no discount. Once a changed-mind return
          is completed with the restocking fee, do not reverse it later. Return shipping
          fee: orders with subtotal < $50 pay $8 return shipping; orders >= $50 get
          free return label; defective/wrong_item/damaged_in_transit always free.
          Fee is deducted from refund. Bulk purchase clawback: if order had 3+ items
          with a discount code and the return drops remaining count below 3, $5 per
          remaining item is deducted from refund; no discount code means no clawback.
          Free shipping clawback: if order subtotal was >= $100 (free shipping) and
          return drops remaining subtotal below $100, $8 flat fee deducted from refund;
          exempt for defective/wrong_item/damaged_in_transit; if order didn''t qualify
          for free shipping originally, no clawback. Repeat category surcharge: returning
          2+ items from the same category in one order costs $5 surcharge per additional
          return (first in each category is free). Agent computes net refund on confirm:
          base_item_price (after promo redistribution) minus restocking_fee plus restocking_discount
          minus shipping_clawback minus bulk_clawback minus repeat_surcharge minus
          paid_return_shipping_fee."}'
    - name: return_delivered_order_items
      description: Request a return for items of a delivered order. Only works if
        order status is 'delivered'. Refund must go to the original payment method
        or an existing gift card. After confirmation, status becomes 'return requested'
        and the user receives return instructions by email.
      output:
        check: '{"order": {"order_id": "#W4669380", "customer_id": "jordan_lee_069",
          "status": "return requested"}}'
    - name: get_user_details
      description: Fetch a user's profile including their name, address, email, payment
