id: tc_lh_4540b3fc_memory
description: 'You are Nina Patel (user_id: user_be7538d5).'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Nina Patel (user_id: user_be7538d5). You are contacting
      customer service because you want to clean up your cart, understand what discounts
      you can actually use, and then possibly add one more electronics item if it
      makes sense. Start by saying you noticed a promo was already on your cart and
      you want that removed so you can see the real pricing before deciding what to
      do next. The cart currently has a Northline Wool Blend Throw Blanket and an
      Everyday Canvas Tote Bag, and you want the agent to confirm the updated subtotal,
      shipping, and total once the promo is taken off.


      After that, ask the agent to explain the loyalty points rules because you may
      want to use some points on this order. Once the rules are clear, tell the agent
      you want to redeem 3400 points and then confirm exactly how much discount that
      created, what your remaining points balance is, and what the cart total becomes.


      Next, ask what active promotions are currently available and whether the summer
      sale code you had before is still valid on your cart. If it is, have the agent
      validate it and put it back on the cart, then ask for the full updated cart
      details again. Also, before moving on, ask it to confirm whether that same code
      is now the only promo on the cart and restate the item list from the beginning
      so you can be sure it updated the right basket. You also want the agent to explain
      the shipping policy at that point, especially since you are a Gold member and
      want to know whether any shipping options are free or discounted.


      Then, after hearing the shipping policy, tell the agent you want to redeem another
      500 points if allowed after the promo has been re-applied. Ask for the exact
      new cart totals and your remaining loyalty balance. Also ask the agent to pull
      up your account and confirm your profile details, including your membership
      tier, email, loyalty points, and whether you count as a first-time customer
      for promo eligibility. When they do, also have them confirm whether the welcome
      offer you asked about earlier is ruled out specifically because of your account
      status.


      Once the discount questions are settled, shift to shopping for one more item
      in electronics. Ask the agent to look for a wireless mouse option. Before they
      check compatibility, ask them to remind you which shipping upgrade was the free
      one for your tier from earlier. When the agent shows choices, focus on the LogiTech
      Wireless Mouse M310 and ask whether it is compatible with the Aurora Smart Desk
      Lamp Pro. Right after they answer that, ask them to also confirm that the electronics
      item you picked is the same one they found as the best match in the search results.
      If it is, tell the agent to add one of that mouse to your existing cart and
      then give you the full cart breakdown again. Also, before adding it, ask whether
      the points total currently on the order would automatically rise from what you
      had redeemed earlier once the cart gets bigger.


      Finally, ask the agent to review current promotions one more time with the cart
      in its new state and check whether a stronger promo now qualifies, especially
      since the total should be higher after adding the electronics item. You are
      not necessarily asking to change the promo at the very end unless the agent
      can clearly explain which code is valid and what discount it would estimate.
      Also, circle back and ask whether that first discount you applied with points
      has now effectively grown along with the larger cart, and have the agent confirm
      the updated redeemed-points total and order total. Then ask one last time whether
      the original seasonal code is still the one applied now that the mouse is in
      the cart.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement. Approve code or command from the agent if prompted'
