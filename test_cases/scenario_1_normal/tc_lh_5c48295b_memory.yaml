      move that trip to 2026-10-01 but keep it as the same kind of one-way SFO to
      LAS booking in economy. Ask them to search nonstop options for that date, work
      out any price difference, and then update that reservation to the replacement
      flight you choose. After they make the change, ask for the full updated reservation
      details, including itinerary, passengers, baggage, insurance, payment history,
      and current status. Also, after they show the replacement options for that changed
      trip, ask them which one matches the route you first checked at the start of
      the call and to restate that option''s full details without making you reidentify
      it.


      Once your own travel is sorted, you also want help pricing out other straightforward
      one-way trips. Ask the agent to calculate the total for a JFK to MIA economy
      booking for Sofia Martinez on 2026-10-01, then confirm Sofia’s full customer
      details on file after that booking is created. Right after they total Sofia’s
      trip, ask them to remind you what the total was for the nonstop option you priced
      for yourself earlier so you can compare them. After Sofia’s booking is created,
      ask the agent to name the payment method used for the trip you booked for yourself
      earlier and confirm that booking’s full details again. Then do something similar
      for Elena Park: search direct LAX to LAS flights for 2026-10-01, calculate the
      economy total for the option you choose, book it for her, and then confirm Elena’s
      full profile and reservation list. After they show Elena’s direct options, ask
      them to also remind you which reservation in your own account was the one you
      changed earlier and what its updated flight details are.


      Finally, ask the agent to search direct SEA to SFO flights for 2026-10-05 and
      calculate the economy total for the cheapest option they find, because you want
      to compare one more possible trip before ending the call. Before they calculate
      that final cheapest option, ask them to pull up that round-trip reservation
      from your profile with the other passenger on it and give you the complete details.
      After they calculate the total for Elena’s trip, ask them to remind you which
      loyalty level and address are listed on your own profile. After Elena’s booking
