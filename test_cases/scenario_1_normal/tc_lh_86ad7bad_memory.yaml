      including its $29 price, 4.9 rating, 1247 reviews, 120 units in stock, 3-day
      shipping, gift-wrap availability, compatibility list, and that it has no variants.
  - check: Agent cites the store exchange policy, including that exchanges must be
      for a different product and that cheaper exchanges refund the difference as
      store credit, then previews the exchange of ITEM-4D366B to PROD-4ED2E3 as eligible
      with a $6 cheaper replacement and $6 store credit refund.
  - check: Agent confirms the exchange was completed for ITEM-4D366B to Everyday Canvas
      Tote Bag, provides the new item identifier if generated, and states the final
      price difference, that the customer pays $0, and that $6 is returned as store
      credit.
  - check: Agent tells Elena Brooks that get_user_reservations shows hotel reservation
      HR-68D9 and car rental CR-68B7, explains that HR-68D9 qualifies for free cancellation
      under the hotel policy because it is a Standard King room cancelled 48+ hours
