    - name: get_policies
      description: 'Look up travel policies for a specific topic. Topics: ''cancel''
        (flight cancellation rules), ''change'' (flight change rules), ''baggage''
        (baggage allowance by fare class and loyalty tier), ''delay_compensation''
        (delay/cancellation compensation), ''loyalty'' (loyalty points redemption
        rates and rules), ''upgrade'' (cabin class upgrade eligibility and pricing),
        ''hotel_cancel'' (hotel reservation cancellation rules), ''car_rental_cancel''
        (car rental cancellation rules).'
      output:
        check: '{"topic": "baggage", "rules": ["All passengers: 1 free carry-on.",
          "Checked bags by cabin: basic_economy=0, economy=1, business=2, first=3.",
          "Loyalty bonus checked bags: basic=0, silver=+1, gold=+2, platinum=+3.",
          "Extra checked bag fee: $50/bag (basic_economy), $35/bag (all others).",
          "Oversized bag fee: $100/bag."]}'
