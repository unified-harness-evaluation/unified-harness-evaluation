id: tc_lh_b5747e42_memory
description: 'You are Maya Ellison (user_id: user_2f384bdb).'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Maya Ellison (user_id: user_2f384bdb). You are calling
      customer service because you want to put together an order today and make sure
      you are getting the best deal before you check out. You also want help comparing
      a few electronics items, applying discounts correctly, choosing shipping, and
      then adding one more item at the end after you have already set up the cart.


      Start by asking the agent to pull up your account and tell you your membership
      tier, loyalty points balance, email on file, and whether the system shows you
      as a first-time customer or not. Then ask them to check your current cart and
      confirm whether there is already anything in it.


      After that, say you are shopping mainly for electronics and want to know what
      options are available. Have the agent help you look at a smart desk lamp, and
      then ask for the full product details on the Aurora Smart Desk Lamp Pro, including
      price, rating, stock, shipping timing, gift-wrap availability, and compatibility
      information. Ask whether it has any variants, because if there are color or
      size options you want to hear those too.


      Once you have that information, ask the agent to add the lamp to your cart.
      Then explain that you also want a magnetic wireless charging stand added so
      your cart is large enough to make discount decisions worth comparing. After
      the cart has items in it, ask the agent to tell you the return policy for regular
      items so you know what would happen if either product does not work out. Also,
      before moving on, ask them to restate the account email they already found earlier
      so you can make sure the order is tied to the right profile.


      Next, ask the agent to check whether promo code PROMO0F1B01 is valid for your
      cart and, if it is, apply it. After that, say you also want to use some loyalty
      points and specify that you want to redeem 500 points. Then ask what shipping
      choices you have for this cart, including the ETA and cost for each one, and
      choose express shipping if it is available. Have the agent confirm the updated
      cart after that. After the loyalty redemption, ask what your points balance
      is now without having them pull everything from scratch again. Also, while you
      are there, ask whether the account still shows you as the same type of customer
      status they mentioned at the start.


      Then circle back and say you want to compare shipping one more time and switch
      to next-day instead, just so you can see the final total with that faster option.
      Ask for the refreshed cart details again. When they confirm it, ask them to
      remind you which free-shipping perk applied to the earlier shipping choice and
      which faster option still costs extra. Also ask them to confirm that the promo
      already attached to the cart is still the same one from earlier and that it
      is still reflected in the total.


      Finally, say you remembered one more thing and want to shop for a wireless mouse.
      Ask the agent to search for wireless mouse options, give you the details for
      the LogiTech Wireless Mouse M310, check whether it has variants, and then add
      one of that item to the same cart. While discussing the mouse, ask whether it
      works with the lamp you looked at earlier. Also ask them to confirm that the
      return rules for this new item are the same ones they quoted before. Before
      the add-to-cart step, ask them to remind you which two products were already
      sitting in the cart before this last item. Right before they add the mouse,
      ask them to confirm that the same shipping selection and discounts from earlier
      are still the ones that should stay on the cart. And once the mouse details
      are given, ask them to confirm whether this item has the same gift-wrap availability
      situation they mentioned for the lamp earlier.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement.'
  max_turns: 60
  skill_validations:
    expected_skill_invocations:
    - skill: state-shopping
  agent_response_validations:
  - check: 'Agent confirms Maya Ellison''s account details: customer ID user_2f384bdb,
      email maya.ellison@example.com, Gold tier, not a first-time customer, and 7,835
      loyalty points at the start of the session.'
  - check: Agent tells the user her cart CART-user_2f384bdb starts empty with subtotal
      0, no discounts, no shipping option selected, and total 0.
  - check: Agent presents the Aurora Smart Desk Lamp Pro product details including
      confirming price of 88, rating 3.5 from 79 reviews, 24 units in stock, 3 business
      days standard shipping, gift wrap available, compatibility list, and no variants
      available.
  - check: Agent confirms the Aurora Smart Desk Lamp Pro was added to the cart at
      unit price 88, then confirms the Magnetic Wireless Charging Stand was added
      at unit price 45, bringing the cart subtotal to 133.
  - check: 'Agent explains the returns policy accurately: 30-day return window from
      delivery date, items must be unused with original packaging, refunds go back
      to the original payment method within 5 business days of return receipt, and
      final-sale items and digital goods are excluded.'
  - check: Agent confirms promo code PROMO0F1B01 is valid for the cart and then states
      it was applied successfully, with a discount of 26.6 on a cart subtotal of 133,
      bringing the cart total to 106.4 before shipping and after promo.
  - check: Agent confirms 500 loyalty points were redeemed for a 5 dollar discount,
      that the remaining loyalty balance is 7,335 points, and that the cart total
      becomes 101.4 after the loyalty redemption.
  - check: Agent presents all three shipping choices for the two-item cart and correctly
      notes that for a Gold-tier customer, express shipping costs 0 and next-day costs
      15, then confirms the cart first with express shipping at total 101.4 and later
      with next-day shipping at total 116.4.
  - check: Agent finds wireless mouse options in electronics and communicates that
      the LogiTech Wireless Mouse M310 is in stock at 29 with a 4.9 rating from 1247
      reviews, standard shipping in 3 business days, gift wrap available, and no variants.
  - check: Agent confirms one LogiTech Wireless Mouse M310 was added to the existing
      cart with no gift wrap, resulting in a cart subtotal of 162 and a cart total
      of 139.6 with the previously selected next-day shipping and existing discounts
      still reflected.
  capability_validations:
    expected_capabilities:
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time
        status, loyalty points, and purchase_history. No stored preferences — the
        agent must ask the customer about per-purchase decisions (e.g., gift wrap,
        shipping speed, brand preference) before acting.'
      output:
        check: '{"customer_id": "user_2f384bdb", "name": "Maya Ellison", "email":
          "maya.ellison@example.com", "tier": "gold", "is_first_time": false, "loyalty_points":
          7835, "purchase_history": []}'
    - name: get_cart
      description: 'Get the customer''s current cart: items with live pricing, subtotal,
        discount, gift-wrap fee, total, and applied promo codes. Does not compute
        promo eligibility — use get_promotions and get_customer_account to reason
        about which promos apply.'
      output:
        check: '{"cart_id": "CART-user_2f384bdb", "customer_id": "user_2f384bdb",
          "items": [], "subtotal": 0, "discount_amount": 0, "gift_wrap_fee": 0, "loyalty_discount":
          0, "loyalty_points_redeemed": 0, "shipping_option": null, "shipping_cost":
          0, "total": 0, "applied_promo_codes": []}'
    - name: get_shipping_options
      description: List shipping options available for the customer's cart. Use ONLY
        when the customer explicitly asks about shipping (speed, cost, deadline, delivery
        time) or when resolving a dated-delivery need. Returns each option's cost,
        ETA, and tier-eligibility note. Do NOT call proactively as part of a standard
        checkout.
      output:
        check: '{"options": [{"shipping_option": "standard", "cost": 6, "eta_days":
          3, "tier_note": "Standard shipping available"}, {"shipping_option": "express",
          "cost": 0, "eta_days": 2, "tier_note": "Free for Gold and Platinum"}, {"shipping_option":
          "next-day", "cost": 15, "eta_days": 1, "tier_note": "Free for Platinum only"}],
          "cart_item_count": 0, "customer_tier": "gold"}'
    - name: get_policies
      description: Look up the store's policy for a given topic. Returns a summary
        and a list of rules. Use this when the customer's question or the scenario
        requires citing store policy.
      output:
        check: '{"topic": "returns", "summary": "30-day return window from delivery
          date for unused items with original packaging; refunds go to original payment
          method within 5 business days of return receipt.", "rules": ["30-day return
          window from delivery date", "Items must be unused and in original packaging",
          "Refund to original payment method within 5 business days of return receipt",
          "Final-sale items and digital goods are not returnable"]}'
    - name: redeem_loyalty_points
      description: 'Redeem the customer''s loyalty points for a dollar discount on
        the current cart. Rules: 100 points = $1. Minimum redemption 500 points. Capped
        at 50% of cart total. Stacks with promo codes but NOT with the first-time
        welcome discount. Points are debited from the customer''s balance.'
      output:
        check: '{"status": "success", "points_redeemed": 500, "discount_applied":
          5, "remaining_balance": 7335, "cart_subtotal": 133, "cart_total": 101.4}'
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time
