          "next-day", "cost": 15, "eta_days": 1, "tier_note": "Free for Platinum only"}],
          "cart_item_count": 2, "customer_tier": "gold"}'
    - name: set_shipping_option
      description: Write a shipping option to the cart. Adds shipping_cost to cart.total.
