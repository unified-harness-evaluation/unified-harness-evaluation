  user_agent:
    task_summary: 'You are Maya Chen (user_id: user_fa209a3f). You are calling customer
      service because you realized you have several different trips and possible new
      bookings to sort out all at once, and you want the agent to keep track of everything
      without making you repeat yourself.


      Start with your round-trip reservation C4C633. Tell the agent you want to cancel
      it because your plans changed and you want to make sure the whole trip is eligible,
      then have them confirm the full itinerary, both passengers, the insurance on
      the booking, the total baggage count, the payment method used, and exactly how
      any refund would work.


      Next, ask the agent to pull up your overall profile so they can see your saved
      payment methods, loyalty tier, contact details, and all active reservations
      before you continue.


      After that, move to your one-way SFO to LAS booking EC4C1C. First ask for the
      full reservation details, then ask the agent to check the status of that flight
      for the travel date. Once they have done that, ask whether that booking can
      also be cancelled and, if it can, cancel it; if it cannot, make them clearly
      explain why under the fare rules and still confirm the complete reservation
      details they reviewed. Also say: "Before we move on, go back to that first booking
      I asked about and remind me exactly how the refund is supposed to work there."
      Then say: "And for that first trip I cancelled, tell me again who was on it
      and what coverage and bags were attached."


      Then shift to your earlier LAX to SFO booking A2CBB0. Tell the agent you want
      to see other direct flight options on the same route and compare costs before
      changing anything. If no flights are available on the exact original date, ask
      them to check the nearest available date instead. Ask them to do the math out
      loud on any fare difference they are using. After they show you the options,
      have them move that reservation to a different direct flight on the same route,
      but only after they summarize the exact new flight and any price impact and
      you explicitly confirm. Before they calculate anything for this change, say:
      "Use the same card I used on the trips we already reviewed." And after they
      pull up the change options, say: "Also confirm whether the other cancelled one
      earlier was the booking under my full name with my middle name included."


      Once that is done, ask them to check the status of the newly selected LAX to
      SFO flight as well. After they give that status, add: "Now compare that with
      the status of the earlier one-way trip we talked about before this change."


      Then say you also want to book a completely new one-way trip from SEA to SFO
      on 2026-10-01 for yourself in economy using your credit card, and you want them
      to search the direct options first, calculate the price before booking, and
      then complete the reservation after your confirmation. After they show the direct
      choices, add: "Pick the cheapest direct option from this search for the booking."
      After booking it, ask for the full reservation details. Once they have booked
      it, also say: "For that new reservation, use the same passenger details as the
      LAX to SFO booking you changed earlier." And then add: "Also compare the price
      of this new ticket with what I paid for the very first reservation we handled."


      After that, ask them to search direct flights from JFK to MIA on 2026-10-01
      for a new one-way economy booking for you, calculate the price, and then book
      it on your credit card after confirming everything. Before they finish that
      booking, say: "Charge this one the same way as the earlier new booking from
      today." Finally, before ending the call, ask them to do one last direct-flight
      search on LAX to SFO on 2026-10-01 and calculate the price of one of the available
      economy options so you can compare it against the other changes and bookings
      you handled today. Before ending the call, also say: "And one more time, summarize
      the first cancelled reservation with both flights and all travelers so I can
      make sure that one is fully closed out correctly."


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement. Approve code or command from the agent if prompted'
