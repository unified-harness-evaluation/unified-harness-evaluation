id: tc_lh_ff9af6fb_memory
description: You are Olivia HR Manager, and you’re reaching out because you need to
  clean up a small onboarding coordination mess before a contractor starts.
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Olivia HR Manager, and you’re reaching out because you
      need to clean up a small onboarding coordination mess before a contractor starts.
      You’ve been tracking equipment setup, follow-ups, and readiness meetings across
      email, calendar, and a spreadsheet, and you want everything tightened up in
      one conversation.


      Start by asking the agent to update the inventory spreadsheet because there’s
      a promo entry that should be cleared out before anyone uses it by mistake. The
      file is data/product_inventory.xlsx, on the Inventory sheet, and the AUTUMN10
      Cart Discount entry is in row 20; you want the product name cell cleared. After
      that, have the agent read the spreadsheet back so you can confirm the inventory
      details around that row and make sure the change really happened.


      Next, you want help drafting a concise professional note based on the inventory
      situation and the onboarding urgency, and then sending that message to Ethan.
      Use the existing high-priority onboarding thread as context: you previously
      sent Ethan the message with the subject High Priority: Onboarding Equipment
      Setup Needed. After the draft is prepared, send Ethan a fresh email confirming
      the onboarding equipment needs are still urgent.


      Then switch to your calendar. Ask the agent to list your events so you can avoid
      conflicts, and then review that earlier email to Ethan for the exact setup requirements.
      Based on that, schedule a new readiness follow-up on your calendar tied to the
      laptop, VPN, and email setup for the contractor, and send Priya a note letting
      her know you’ve added a follow-up check. Also, before moving on, have the agent
      confirm again which inventory row was the cleared promo line and what that row
      still shows now.


      After that, ask the agent to look at Priya’s calendar, then open the follow-up
      email thread you already sent her with the subject High Priority: Onboarding
      Equipment Setup Needed - Follow-Up. Using that context, create a new coordination
      event on Priya’s calendar as well, and then send Ethan another update that Priya
      has been looped in. And when you send that update, make sure it’s clear it’s
      the same urgent onboarding request from earlier, with the same setup items,
      without re-checking with me.


      Before wrapping up, go back and ask the agent to list Ethan’s inbox so you can
      confirm the thread visibility there. Then have the agent open the original Ethan
      onboarding email again, create one more related event on your own calendar,
      send a final email update to Priya, list your calendar one more time, and read
      that Priya follow-up email again so you can verify the whole coordination trail
      is consistent. After Priya’s coordination event is created, also have the agent
      restate the exact timing and summary for the event that was added to her calendar
      a moment earlier. And right near the end, ask it to go back to the follow-up
      it sent Priya earlier and confirm that it’s still referring to the same contractor
      setup requirements from before.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement.'
  max_turns: 60
  skill_validations:
    expected_skill_invocations:
    - skill: OfficeBench
  agent_response_validations:
  - check: Agent confirms that the product name cell for PROD-4809AA in data/product_inventory.xlsx
      was cleared, and then reports that row 20 still shows category promotion, price
      0.0, and In Stock Yes while the name field is now blank.
  - check: 'Agent tells the user it prepared a professional reminder to Ethan about
      the contractor setup and confirms an email was sent to ethan.it.specialist from
      olivia.hr.manager with the subject High Priority: Onboarding Equipment Setup
      Needed covering the Windows laptop, VPN access, and email configuration needed
      before the next business day.'
  - check: Agent reports Olivia's existing calendar includes New Hire Readiness Check
      (Virtual) — laptop, VPN/email, day-one setup on 2026-09-08 from 10:00:00 to
      10:30:00 and Contractor Day-One Setup Check — laptop, VPN/email, access readiness
      on 2026-09-05 from 15:00:00 to 15:30:00.
  - check: Agent summarizes the original Ethan email and states that it explicitly
      requests a standard Windows laptop, VPN access, and email configured before
      start of business on the next business day for a newly onboarded contractor.
  - check: 'Agent confirms a new event was added to Olivia''s calendar using the New
      Hire Readiness Check (Virtual) — laptop, VPN/email, day-one setup timing of
      2026-09-08 10:00:00 to 2026-09-08 10:30:00, and also confirms a follow-up email
      was sent to Priya with the subject High Priority: Onboarding Equipment Setup
      Needed - Follow-Up.'
  - check: Agent reports Priya's calendar currently includes Onboarding Readiness
      Sync — laptop, VPN/email, day-one setup on 2026-09-09 from 11:00:00 to 11:30:00,
      summarizes the earlier Priya follow-up email, and confirms a new coordination
      event was added for Priya with that same summary and time window.
  - check: 'Agent tells the user Ethan''s inbox contains the email ethan.it.specialist/High
      Priority: Onboarding Equipment Setup Needed.eml from olivia.hr.manager@company.com
      to ethan.it.specialist@company.com, and then confirms another update email was
      sent to Ethan noting Priya had been looped in.'
  - check: 'Agent confirms it reread the Ethan onboarding email, added another event
      to Olivia''s calendar using Contractor Day-One Setup Check — laptop, VPN/email,
      access readiness for 2026-09-05 15:00:00 to 15:30:00, sent a final follow-up
      to Priya, then restated Olivia''s calendar details and reread Priya''s High
      Priority: Onboarding Equipment Setup Needed - Follow-Up email to verify the
      coordination trail.'
