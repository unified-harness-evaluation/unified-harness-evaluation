  memory_agent_response_validations:
  - check: Agent recalls that the earlier cleared promo line was row 20 on the Inventory
      sheet in data/product_inventory.xlsx, corresponding to product ID PROD-4809AA,
      without asking the user to repeat it.
    trap_id: __trap_0
  - check: Agent correctly restates that the cleared inventory row now has a blank
      product name while still showing category promotion, price 0.0, and In Stock
      Yes.
    trap_id: __trap_0
  - check: 'Agent recalls that the earlier urgent onboarding request to Ethan was
      the High Priority: Onboarding Equipment Setup Needed thread sent to ethan.it.specialist,
      without asking for the subject or recipient again.'
    trap_id: __trap_1
  - check: 'Agent correctly carries forward the same setup requirements from the earlier
      Ethan message: a standard Windows laptop, VPN access, and email configured before
      start of business on the next business day.'
    trap_id: __trap_1
  - check: Agent recalls that the event just added to Priya's calendar was the Onboarding
      Readiness Sync — laptop, VPN/email, day-one setup event, without the user restating
      the event details.
    trap_id: __trap_2
  - check: Agent correctly restates the Priya coordination event timing as 2026-09-09
      from 11:00:00 to 11:30:00 along with the exact summary.
    trap_id: __trap_2
  - check: 'Agent recalls that the earlier follow-up sent to Priya was the High Priority:
      Onboarding Equipment Setup Needed - Follow-Up email, without asking the user
      to repeat the thread details.'
    trap_id: __trap_3
  - check: 'Agent correctly confirms that Priya''s earlier follow-up still refers
      to the same contractor setup requirements: standard Windows laptop, VPN access,
      and email configured before start of business on the next business day.'
    trap_id: __trap_3
  trap_information:
    traps:
    - name: __trap_0
      position_in_full_chain: 3
      insert_after_real_step: 2
      recalled_entity: the cleared promo inventory entry in row 20
      recalled_details:
      - data/product_inventory.xlsx
      - Inventory sheet
      - row 20
      - PROD-4809AA
      - product name cell cleared
      - category promotion
      - price 0.0
      - In Stock Yes
      recalls_from_step: 1
      callback_text: Also, before moving on, have the agent confirm again which inventory
        row was the cleared promo line and what that row still shows now.
    - name: __trap_1
      position_in_full_chain: 5
      insert_after_real_step: 3
      recalled_entity: the earlier urgent onboarding email to Ethan
      recalled_details:
      - ethan.it.specialist
      - 'High Priority: Onboarding Equipment Setup Needed'
      - standard Windows laptop
      - VPN access
      - email configured
      - before start of business on the next business day
      recalls_from_step: 3
      callback_text: And when you send that update, make sure it’s clear it’s the
        same urgent onboarding request from earlier, with the same setup items, without
        re-checking with me.
    - name: __trap_2
      position_in_full_chain: 13
      insert_after_real_step: 10
      recalled_entity: the coordination event added to Priya's calendar
      recalled_details:
      - Onboarding Readiness Sync — laptop, VPN/email, day-one setup
      - '2026-09-09 11:00:00'
      - '2026-09-09 11:30:00'
      recalls_from_step: 11
      callback_text: After Priya’s coordination event is created, also have the agent
        restate the exact timing and summary for the event that was added to her calendar
        a moment earlier.
    - name: __trap_3
      position_in_full_chain: 20
      insert_after_real_step: 16
      recalled_entity: the earlier Priya follow-up email
      recalled_details:
      - 'High Priority: Onboarding Equipment Setup Needed - Follow-Up'
      - priya.it.lead
      - standard Windows laptop
      - VPN access
      - email configured
      - before start of business on the next business day
      recalls_from_step: 8
      callback_text: And right near the end, ask it to go back to the follow-up it
        sent Priya earlier and confirm that it’s still referring to the same contractor
        setup requirements from before.
