    - name: llm.complete_text
      description: Send a prompt to the configured LLM (default azure/gpt-4.1, temperature
        0, max 512 tokens) and return the response
      output:
        check: '{"response": "Hello Ethan,\n\nThis is a quick reminder that the onboarding
