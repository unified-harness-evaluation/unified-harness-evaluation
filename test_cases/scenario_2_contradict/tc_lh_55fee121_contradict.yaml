    trap_id: __trap_0
  - check: Agent detects the user's later claim that Jordan Kim’s contact record's
      phone number is '+1-312-555-0172' contradicts what the user stated earlier ('+1-646-555-0134'),
      catches it from conversation memory, and corrects or seeks confirmation instead
