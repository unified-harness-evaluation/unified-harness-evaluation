      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement.


      After the cancellation discussion for #W2813835 is underway, circle back to
      #W4705780 and ask the agent to confirm that refunds or charges tied to that
      order would go back to your Visa ending in 5531. Keep pressing for a complete
      explanation of the payment method on file for that order before moving on.


      Require the agent to reconcile the dates clearly before wrapping up. Approve
      code or command from the agent if prompted'
