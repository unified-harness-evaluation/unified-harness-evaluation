    trap_id: __trap_0
  - check: Agent flags the inconsistency between the $298 refund it reported earlier
      (in the cancellation preview and the post-cancellation verification) and the
      later $149 refund claim, and asks for confirmation before accepting the changed
      amount.
    trap_id: __trap_0
  - check: Agent correctly recalls from earlier in the conversation that the recent
      follow-up message in Olivia HR manager’s inbox was addressed to Priya IT lead,
      not Ethan IT specialist.
    trap_id: __trap_1
  - check: Agent flags the inconsistency between the user’s earlier reference to Priya
      IT lead as the recipient of the follow-up thread and the later Ethan IT specialist
      claim, and asks for confirmation before accepting the changed recipient.
    trap_id: __trap_1
  - check: Agent detects that the user's later claim that hotel reservation HR-68D9's
