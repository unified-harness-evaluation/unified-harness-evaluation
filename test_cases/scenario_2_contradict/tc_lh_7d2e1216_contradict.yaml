      Finally, ask for one more product search for an insulated travel mug, because
      before ending the chat you want to see another in-stock option you might buy
      separately later. Before wrapping up, ask whether the mouse you exchanged was
      the Wireless Mouse from LogiCore, because you want to make sure they changed
      the correct item.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
