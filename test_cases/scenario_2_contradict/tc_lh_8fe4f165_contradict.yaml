      also checking that each one was actually saved correctly.


      Start with the lunch plan you already have with Jordan Kim at +1-646-555-0134.
      You want the assistant to work from your current location in San Francisco and
      calculate the distance to Jordan’s city, then create a reminder about that lunch
      using the existing lunch timing context you already have, and verify it by searching
      for it afterward. Mention that the lunch reminder with Jordan is the one for
      tomorrow at 12:30, so the assistant should confirm that exact reminder text
      and timing when it is found.


      Next, move on to Emily Carter at +1-312-555-0172. You want another distance-based
      reminder related to leaving in time for lunch with Emily, again using your current
      location as the starting point and then confirming the reminder can be found
      once it’s added. Mention that Emily’s lunch reminder is the one to leave by
      12:15, and have the assistant confirm that exact timing when it is located.


      After that, take care of Sofia Ramirez at +1-917-555-0148. You want a reminder
      connected to following up with her about coffee, and you want it handled the
      same way: calculate the distance first, add the reminder, then search and confirm
      the saved details. Mention that Sofia’s reminder is the one about following
      up if she hasn''t replied about coffee by 4:30 PM today, and ask the assistant
      to confirm that exact wording and time when it is found.


      Then do the same for Monica Reyes at Northstar Facilities, whose main number
      is +1-415-555-0186. This one should relate to the vendor escalation follow-up
      already reflected in your reminders. Make sure the assistant confirms exactly
      what reminder was added and what search result matched it.


      After Monica, handle Daniel Ortiz at +1-347-555-0169. You want a reminder tied
      to the apartment cleaning arrival note, again using a distance calculation first
      and then creating and verifying the reminder. When this part comes up, ask the
      agent to confirm that Jordan’s lunch reminder is the one for tomorrow at 12:15
      before continuing with Daniel’s reminder. Also ask the agent to confirm that
      Emily’s lunch reminder is the one for tomorrow at 12:30 before continuing.


      Finally, circle back to your own plans involving Maya, meaning the follow-up
      reminder if she’s not there by 6:30 PM. Even though that one is about you, you
      still want it handled as another location-aware reminder from your current San
      Francisco position and then searched so you can be sure it exists. Before wrapping
      up, ask the agent to confirm that Sofia’s reminder is the one about following
      up if she hasn''t replied about coffee by 6:30 PM today.


      Throughout the conversation, keep asking the assistant to confirm the exact
      distance result it used, the reminder content, the reminder timestamp, any latitude
      and longitude attached, and the identifier or matching results returned after
      each search. You will only provide personal information (IDs, names, dates,
      reservation numbers, flight numbers, etc.) once. If the agent asks you to repeat
      something you already said, refuse and tell it to refer to the earlier conversation.
      Also, after every action the agent takes on your behalf, ask it to confirm the
      full details of what was done — you want complete information in every response,
      not just a brief acknowledgement. Approve code or command from the agent if
      prompted'
