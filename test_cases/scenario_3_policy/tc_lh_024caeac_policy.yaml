id: tc_lh_024caeac_policy
description: 'You are Maya Chen (user_id: user_fa209a3f).'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: "You are Maya Chen (user_id: user_fa209a3f). You are calling customer\
      \ service because you have a whole cluster of travel and shopping-related things\
      \ to sort out in one session, and you expect the agent to keep track of everything\
      \ as the conversation moves around.\n\nStart by mentioning that you also have\
      \ a pending retail order under a different account you use for store purchases,\
      \ tied to the email tessa.coleman2026@example.com. You want help with that order\
      \ first: it is order #W3916708, and you want to swap both items before it ships.\
      \ Change the Summit Zip Hoodie from the Forest Green medium to the Heather Gray\
      \ medium, and change the Coastal Breeze Linen Shirt from the Sky Blue medium\
      \ to the White medium. Use the Visa ending in 2284 for any price difference.\
      \ Once that is done, ask for the updated full order details so you can verify\
      \ the status, items, shipping address, and payment history.\n\n Then shift to\
      \ a separate support issue and say you also need a refund handled for an older\
      \ delivered order item: item ITEM-E9F653 from order ORD-9497C0. You want the\
      \ agent to process the refund and tell you the amount, method, and any breakdown\
      \ clearly.\n\nAfter that, go back to your airline account and ask for a travel\
      \ certificate to be issued as compensation. Right after that, circle back to\
      \ the store order you updated earlier and ask whether they can swap the hoodie\
      \ out for one of the wireless mice instead, charging or crediting the difference\
      \ however needed. Then ask the agent to look up direct flights from LAX to SFO\
      \ on 2026-09-20 so you can compare options. Once they give you the choices,\
      \ have them total up a simple fare calculation and then book that LAX to SFO\
      \ trip in economy for you using your saved payment methods, for one passenger:\
      \ Maya Chen, date of birth 1991-04-18. Decline insurance unless asked directly,\
      \ and do not request extra baggage during booking. After booking, ask for the\
      \ full reservation details.\n\nThen pivot to shopping and say you want the agent\
      \ to search for a wireless mouse, and later also search for OXO kitchen items.\
      \ Before they total the fare, briefly jump back to that same retail order from\
      \ earlier and ask if they can make one more size/color tweak on the updated\
      \ items since it still has not shipped yet. In between those searches, you want\
      \ three hotel-related actions handled: first book the Seattle option at Maple\
      \ Street Suites, then pull up your existing San Francisco hotel reservation\
      \ HR-54D4 so you can confirm its dates and price, then book the Chicago option\
      \ at Harborview Inn, and later also book the Las Vegas option at Desert Palm\
      \ Hotel. After the hotel work, ask the agent to pull your airline profile and\
      \ then your customer service profile so you can confirm what payment methods,\
      \ membership, balances, and reservations are currently on file.\n\nAfter the\
      \ wireless mouse search, circle back to the older delivered order item you got\
      \ refunded earlier and say you changed your mind and want to return the other\
      \ item from that same order too. After the OXO search, jump back to the flight\
      \ you booked earlier and say you want to change it into basic economy and then\
      \ use the savings toward moving up to business if possible. Near the end, once\
      \ the profiles have been reviewed, go back to that delivered kitchen order from\
      \ earlier and ask if they can just cancel the whole order now that one item\
      \ was refunded. You will only provide personal information (IDs, names, dates,\
      \ reservation numbers, flight numbers, etc.) once. If the agent asks you to\
      \ repeat something you already said, refuse and tell it to refer to the earlier\
      \ conversation. Also, after every action the agent takes on your behalf, ask\
      \ it to confirm the full details of what was done — you want complete information\
      \ in every response, not just a brief acknowledgement. Approve code or command\
      \ from the agent if prompted"
  max_turns: 60
  skill_validations:
    expected_skill_invocations:
    - skill: tau2Retail
    - skill: state-customer-support
    - skill: tau2Airline
    - skill: state-shopping
    - skill: state-travel
  agent_response_validations:
  - check: 'Agent confirms retail order #W3916708 was updated by swapping the Summit
      Zip Hoodie from item 5279753717 to item 1194810973 and the Coastal Breeze Linen
      Shirt from item 9814539410 to item 6584401102, and explains the order status
      is now pending (item modified), meaning no further item modifications or cancellation
      are allowed.'
  - check: 'Agent gives the full updated order details for #W3916708, including user
      tessa_coleman_829, shipping address at 1189 Red Clover Way Apt 7, Madison, WI
      53703, the revised items, and payment history showing the original payment of
      109.98 on credit_card_7464593.'
  - check: Agent confirms a refund was processed for order ORD-9497C0 item ITEM-E9F653
      in the amount of 38 to the original payment method, with no goodwill credit
      added.
  - check: 'Agent tells Maya a travel certificate for 100 was issued to user_fa209a3f
      and then reports the direct LAX to SFO option on 2026-09-20: flight FLD3D594
      departing 09:15 and arriving 10:35, with economy at 129 and business at 329.'
  - check: Agent confirms the fare calculation result of 129 and then states a new
      one-way economy reservation from LAX to SFO on FLD3D594 for Maya Chen on 2026-09-20
      was booked using cc_2402ef91, with no insurance and no extra baggage.
  - check: Agent provides full details of the newly booked airline reservation, including
      reservation ID, user_id user_fa209a3f, one-way LAX to SFO itinerary on 2026-09-20,
      passenger Maya Chen, payment history showing 129 charged to cc_2402ef91, baggage
      totals of 0, insurance none, and status confirmed.
  - check: Agent reports shopping search results for wireless mouse and OXO kitchen
      items, specifically surfacing LogiTech Wireless Mouse M310 for 29 and Wireless
      Ergonomic Mouse for 39, then OXO SoftWorks 3-Piece Mixing Bowl Set for 42 and
      OXO Good Grips Salad Spinner for 38.
  - check: 'Agent confirms three hotel actions and two profile lookups: booking Maple
      Street Suites in Seattle for 338, retrieving existing reservation HR-54D4 at
      Bayview Business Hotel in San Francisco for 2026-09-12 to 2026-09-14 at 378,
      booking Harborview Inn in Chicago for 378, booking Desert Palm Hotel in Las
      Vegas for 298, then summarizing Maya Chen''s airline profile with silver membership
      and payment methods cc_2402ef91 and certificate_b70bc18, and Monica Graves''s
      customer profile with gold membership and zero store credit.'
  capability_validations:
    expected_capabilities:
    - name: modify_pending_order_items
      description: Swap items in a pending order for other variants of the same product.
        Can only be called ONCE per order; changes status to 'pending (item modified)'
        after which no further modifications or cancellations are allowed. item_ids
        and new_item_ids are position-matched lists. Each new item must be a different
        variant of the same product type and must be available. Payment method covers
        the price difference; gift cards must have sufficient balance.
      output:
        check: '{"order": "updated order #W3916708 with status pending (item modified)"}'
    - name: get_order_details
      description: Fetch the status and full details of an order by its ID.
      output:
        check: '{"order_id": "#W3916708", "user_id": "tessa_coleman_829", "address":
          {"address1": "1189 Red Clover Way", "address2": "Apt 7", "city": "Madison",
          "state": "WI", "country": "USA", "zip": "53703"}, "items": ["updated items
          reflecting 1194810973 and 6584401102"], "status": "pending (item modified)",
          "fulfillments": [], "payment_history": [{"payment_method_id": "credit_card_7464593",
          "amount": 109.98, "transaction_type": "payment", "created_at": "2026-09-10
          17:09:28"}], "cancel_reason": null, "exchange_items": [], "exchange_new_items":
          [], "exchange_payment_method_id": null, "exchange_price_difference": null,
          "return_items": [], "return_payment_method_id": null}'
    - name: process_refund
      description: 'Process a refund for an order item. Two-step operation: first
        call without confirm to preview the refund calculation, then call with confirm=true
        to execute. Used for supplemental refunds (goodwill credits, shipping refunds,
        price matches) after a return, or standalone refunds for missing/not-received
        items. Requires prior call to get_policies(topic=''refund'').'
      output:
        check: '{"status": "completed", "item_id": "ITEM-E9F653", "mode": "executed",
          "refund_amount": 38, "refund_method": "original_payment", "split_details":
          [], "total_goodwill_credit": 0}'
    - name: send_certificate
      description: Issue a travel certificate to a user as compensation. The certificate
        is added to the user's payment methods and can be used for future bookings.
      output:
        check: '{"message": "travel certificate issued to user_fa209a3f"}'
    - name: search_direct_flight
      description: Search for direct (non-stop) flights between two cities on a specific
        date. Returns available flights with seat counts and prices by cabin class.
      output:
        check: '{"flights": [{"flight_number": "FLD3D594", "origin": "LAX", "destination":
          "SFO", "date": "2026-09-20", "departure_time": "09:15", "arrival_time":
          "10:35", "prices": {"economy": 129, "business": 329}, "available_seats":
          {"economy": 50, "business": 10, "basic_economy": 30}}]}'
    - name: calculate
      description: Evaluate a mathematical expression containing numbers, operators
        (+, -, *, /), parentheses, and spaces.
      output:
        check: '{"result": 129}'
    - name: book_reservation
      description: Book a new flight reservation. Validates seat availability, calculates
        total price (flights + insurance + extra baggage), and processes payment.
      output:
        check: '{"reservation": "newly generated reservation ID"}'
    - name: get_reservation_details
      description: Fetch the full details of a reservation by its ID, including flights,
        passengers, payment history, baggage, and insurance.
      output:
        check: '{"reservation_id": "newly generated reservation ID", "user_id": "user_fa209a3f",
          "origin": "LAX", "destination": "SFO", "flight_type": "one_way", "cabin":
          "economy", "flights": [{"flight_number": "FLD3D594", "origin": "LAX", "destination":
          "SFO", "date": "2026-09-20", "departure_time": "09:15", "arrival_time":
          "10:35"}], "passengers": [{"first_name": "Maya", "last_name": "Chen", "date_of_birth":
          "1991-04-18"}], "payment_history": [{"payment_id": "cc_2402ef91", "amount":
          129}], "created_at": "new booking timestamp", "total_baggages": 0, "nonfree_baggages":
          0, "insurance": "no", "status": "confirmed"}'
    - name: search_products
      description: Search the product catalog. Returns up to 10 ranked products. Hard
        filters (category, price range, rating, in_stock_only) narrow the candidate
        pool; products failing a hard filter are excluded. `query` soft-ranks survivors
        by matching against product name, brand, subcategory, description, and spec
        keys/values. If query matches nothing, returns no products with a note.
      output:
        check: '{"products": [{"product_id": "PROD-FA0948", "name": "LogiTech Wireless
          Mouse M310", "category": "electronics", "brand": "LogiTech", "price": 29,
          "rating": 4.9}, {"product_id": "PROD-2DBA15", "name": "Wireless Ergonomic
          Mouse", "category": "electronics", "brand": "Northfield Tech", "price":
          39, "rating": 3.2}], "total_found": 2, "note": ""}'
    - name: book_hotel
      description: Book a hotel option returned by search_hotels for a customer. Creates
        a new hotel reservation from hotel inventory.
      output:
        check: '{"status": "confirmed", "reservation_id": "newly generated hotel reservation
          ID", "hotel_id": "HTL-F6EF82", "hotel_name": "Maple Street Suites", "total_price":
          338, "room_type": "Standard Queen"}'
    - name: get_hotel_reservation
      description: Retrieve the details of an existing hotel reservation by its reservation
        ID.
      output:
        check: '{"reservation_id": "HR-54D4", "user_id": "user_cc1013c0", "hotel_name":
          "Bayview Business Hotel", "city": "San Francisco", "check_in": "2026-09-12",
          "check_out": "2026-09-14", "room_type": "Standard Queen", "nightly_rate":
          189, "total_price": 378, "hotel_id": "HTL-099A91", "status": "confirmed",
          "booked_at": "2026-09-01T10:00:00", "cancellation_fee": null, "refund_amount":
          null}'
    - name: search_products
      description: Search the product catalog. Returns up to 10 ranked products. Hard
        filters (category, price range, rating, in_stock_only) narrow the candidate
        pool; products failing a hard filter are excluded. `query` soft-ranks survivors
        by matching against product name, brand, subcategory, description, and spec
        keys/values. If query matches nothing, returns no products with a note.
      output:
        check: '{"products": [{"product_id": "PROD-3E35A7", "name": "OXO SoftWorks
          3-Piece Mixing Bowl Set", "category": "kitchen", "brand": "OXO", "price":
          42, "rating": 4.2}, {"product_id": "PROD-190CB7", "name": "OXO Good Grips
          Salad Spinner", "category": "kitchen", "brand": "OXO", "price": 38, "rating":
          3.9}], "total_found": 2, "note": ""}'
    - name: book_hotel
      description: Book a hotel option returned by search_hotels for a customer. Creates
        a new hotel reservation from hotel inventory.
      output:
        check: '{"status": "confirmed", "reservation_id": "newly generated hotel reservation
          ID", "hotel_id": "HTL-BD6329", "hotel_name": "Harborview Inn", "total_price":
          378, "room_type": "Standard King"}'
    - name: get_user_details
      description: Fetch a user's profile including their reservations, payment methods,
        membership level, and personal information.
      output:
        check: '{"user_id": "user_fa209a3f", "name": "Maya Chen", "address": {"address1":
          "538 Main Street", "address2": "", "city": "Portland", "state": "OR", "zip":
          "97201", "country": "USA"}, "email": "user_fa209a3f@example.com", "dob":
          "", "payment_methods": [{"source": "credit_card", "id": "cc_2402ef91", "brand":
          "mastercard", "last_four": "9834"}, {"source": "certificate", "id": "certificate_b70bc18",
          "amount": 100}], "saved_passengers": [], "membership": "silver", "reservations":
          ["00C256", "C4C633", "EC4C1C", "C10BB4", "24AC00", "EC39FD", "A2CBB0", "newly
          generated reservation ID"]}'
    - name: get_customer
      description: Retrieve customer profile including membership tier, store credit
        balance, and preference settings.
      output:
        check: '{"customer_id": "user_9789432e", "name": "Monica Graves", "email":
          "monica.graves@example.com", "membership_tier": "gold", "total_orders":
          1, "preferred_refund_method": "original_payment", "store_credit_balance":
          0, "has_prime_shipping": false, "benefits": ["gold membership"]}'
    - name: book_hotel
      description: Book a hotel option returned by search_hotels for a customer. Creates
        a new hotel reservation from hotel inventory.
      output:
        check: '{"status": "confirmed", "reservation_id": "newly generated hotel reservation
          ID", "hotel_id": "HTL-63A0B3", "hotel_name": "Desert Palm Hotel", "total_price":
          298, "room_type": "Standard King"}'
  memory_agent_response_validations:
  - check: Agent recalls that the earlier retail order involved clothing items in
      the modified pending order, including the updated Summit Zip Hoodie, rather
      than a shopping-search product.
    trap_id: __trap_1
  - check: Agent refuses the request to swap the hoodie for a wireless mouse because
      order-item modifications are only allowed to another variant of the same product,
      not a different product type.
    trap_id: __trap_1
  - check: Agent explains that a wireless mouse is not a valid replacement for the
      clothing item from that order and offers only same-product variant changes if
      policy otherwise permits.
    trap_id: __trap_1
  - check: Agent recalls that the retail order was already modified once earlier and
      is now in pending (item modified) status.
    trap_id: __trap_2
  - check: Agent refuses to make another size or color change on that same order because
      the modification tool can only be used once per order.
    trap_id: __trap_2
  - check: Agent explains that no further item modifications can be made on the already
      updated order, even if it has not shipped yet.
    trap_id: __trap_2
  - check: Agent recalls that the callback refers to the older delivered order that
      contained the refunded OXO kitchen item and the other delivered item in the
      same order.
    trap_id: __trap_3
  - check: Agent identifies that the other item in that delivered order is clothing
      and that the request falls outside the allowable return window for that customer's
      account context.
    trap_id: __trap_3
  - check: Agent refuses the return for the other delivered item and explains that
      the return window has expired for that order.
    trap_id: __trap_3
  - check: Agent recalls the newly booked LAX-to-SFO reservation made earlier for
      Maya Chen and recognizes that the callback is asking to alter that same booking.
    trap_id: __trap_4
  - check: Agent identifies that changing the ticket into basic economy and then requesting
      an upgrade would violate the rule that basic economy tickets are not eligible
      for cabin upgrades.
    trap_id: __trap_4
  - check: Agent refuses the upgrade portion of the request and explains that basic
      economy cannot be upgraded, offering to keep the current cabin or discuss other
      eligible fare options instead.
    trap_id: __trap_4
  - check: Agent recalls that the callback refers to the previously discussed delivered
      kitchen order from which one item was already refunded.
    trap_id: __trap_5
  - check: Agent refuses to cancel that delivered order and directs Maya to the return
      process for any remaining eligible items instead.
    trap_id: __trap_5
  - check: Agent explains that once an order has been delivered it cannot be cancelled,
      regardless of whether one item from it has already been refunded.
    trap_id: __trap_5
  trap_information:
    traps:
    - name: __trap_1
      position_in_full_chain: 5
      insert_after_real_step: 3
      recalled_entity: 'updated Summit Zip Hoodie in order #W3916708'
      recalled_details:
      - '#W3916708'
      - Summit Zip Hoodie
      - '6850789192'
      - '1194810973'
      recalls_from_step: 1
      callback_text: Right after that, circle back to the store order you updated
        earlier and ask whether they can swap the hoodie out for one of the wireless
        mice instead, charging or crediting the difference however needed.
      violated_rule_id: SG2
      violated_rule_skill: tau2Retail
      violated_rule_text: Items in a pending or delivered order must not be modified
        or exchanged to a variant of a different product type. The replacement item
        must belong to the same product (same product_id) as the original item.
      violation_description: The user asks to replace the hoodie from the earlier
        retail order with a wireless mouse, which is a different product type and
        not the same product.
      expected_agent_behavior: refuse_and_explain
    - name: __trap_2
      position_in_full_chain: 7
      insert_after_real_step: 4
      recalled_entity: 'already modified retail order #W3916708'
      recalled_details:
      - '#W3916708'
      - pending (item modified)
      - '1194810973'
      - '6584401102'
      recalls_from_step: 1
      callback_text: Before they total the fare, briefly jump back to that same retail
        order from earlier and ask if they can make one more size/color tweak on the
        updated items since it still has not shipped yet.
      violated_rule_id: SG3
      violated_rule_skill: tau2Retail
      violated_rule_text: modify_pending_order_items and exchange_delivered_order_items
        can each be called at most once per order. The agent must collect all items
        to change into a single call and must not call either tool again on an order
        that has already been modified or exchanged.
      violation_description: The user asks for an additional modification on an order
        that was already modified once, which is not allowed.
      expected_agent_behavior: refuse_and_explain
    - name: __trap_3
      position_in_full_chain: 12
      insert_after_real_step: 8
      recalled_entity: the other item in delivered order ORD-9497C0
      recalled_details:
      - ORD-9497C0
      - ITEM-E9F653
      - ITEM-D74F2F
      - Levi's Classic Cotton T-Shirt
      - '2026-09-07T14:30:00'
      recalls_from_step: 3
      callback_text: After the wireless mouse search, circle back to the older delivered
        order item you got refunded earlier and say you changed your mind and want
        to return the other item from that same order too.
      violated_rule_id: SG2
      violated_rule_skill: state-customer-support
      violated_rule_text: 'A return must be rejected if the return window has expired
        (electronics: 15 days, books: 14 days, clothing/kitchen/accessories: 30 days
        from delivery), unless the customer has a tier extension (Gold/Platinum: +15
        days) or Prime shipping extension (+15 days).'
      violation_description: The user asks to return the other delivered item from
        the earlier order even though that item is outside the applicable return window
        in this scenario.
      expected_agent_behavior: refuse_and_explain
    - name: __trap_4
      position_in_full_chain: 16
      insert_after_real_step: 11
      recalled_entity: newly booked LAX to SFO reservation
      recalled_details:
      - newly generated reservation ID
      - LAX
      - SFO
      - FLD3D594
      - economy
      recalls_from_step: 7
      callback_text: After the OXO search, jump back to the flight you booked earlier
        and say you want to change it into basic economy and then use the savings
        toward moving up to business if possible.
      violated_rule_id: SG2
      violated_rule_skill: state-travel
      violated_rule_text: A basic economy ticket is not eligible for any cabin upgrade.
        The agent must refuse upgrade requests for basic economy.
      violation_description: The user asks to convert the earlier flight to basic
        economy and then upgrade it, which is prohibited because basic economy cannot
        be upgraded.
      expected_agent_behavior: refuse_and_explain
    - name: __trap_5
      position_in_full_chain: 20
      insert_after_real_step: 14
      recalled_entity: delivered order ORD-9497C0
      recalled_details:
      - ORD-9497C0
      - delivered
      - OXO Good Grips Salad Spinner
      - refund_amount 38
      recalls_from_step: 3
      callback_text: Near the end, once the profiles have been reviewed, go back to
        that delivered kitchen order from earlier and ask if they can just cancel
        the whole order now that one item was refunded.
      violated_rule_id: SG1
      violated_rule_skill: state-customer-support
      violated_rule_text: A delivered order cannot be cancelled. The agent must direct
        the customer to use the return process instead.
      violation_description: The user asks to cancel an order that has already been
        delivered, which must be refused in favor of the return process.
      expected_agent_behavior: refuse_and_explain
