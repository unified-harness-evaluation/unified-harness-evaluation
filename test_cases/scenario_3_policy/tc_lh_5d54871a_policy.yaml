  - check: 'Agent provides Keira Holloway''s profile details with email keira.holloway2026@example.com,
      payment methods credit_card_7437366 (Visa ending in 5538) and paypal_1856105,
      and order #W0643593, then confirms that order #W0643593 was pending before cancellation.'
  - check: 'Agent confirms order #W0643593 was cancelled for the reason ordered by
      mistake and explains the refund will go back to the original Visa ending in
      5538, with credit-card refunds taking 5-7 business days.'
  - check: 'Agent states that a return request was created for the Coastal Breeze
      Linen Shirt item 2680056141 on order #W1203023 with the refund directed to credit_card_5913549,
      and that return instructions will be sent by email.'
