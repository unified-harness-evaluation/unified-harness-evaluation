  - check: 'Agent provides Ethan''s account details, including email ethan.calloway2026@example.com,
      payment methods credit_card_5913549 (Visa ending in 2841) and paypal_9170405,
      and order #W1203023.'
  - check: 'Agent explains that order #W1203023 was delivered to 2716 Birch Hollow
      Rd, Apt 4A, Richmond, VA 23223, includes a Summit Zip Hoodie in Heather Gray
      size M (item 1194810973) and a Coastal Breeze Linen Shirt in Sky Blue size S
      (item 2680056141), has tracking number TRK4827319056, and was paid with credit_card_5913549.'
  - check: 'Agent confirms the Summit Zip Hoodie product 6850789192 variants, including
      the Forest Green size M option item 5279753717 priced at 55.54, and then states
      the exchange request on order #W1203023 was submitted from item 1194810973 to
      5279753717 using credit_card_5913549 with a price difference of -0.55 and updated
