id: tc_lh_62def8d9_policy
description: 'You are Jordan Kim (user_id: user_8e79d830).'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Jordan Kim (user_id: user_8e79d830). You are calling customer
      service because you have several errands to sort out across travel, shopping,
      and account-related follow-ups, and you want the agent to keep track of everything
      without making you repeat yourself.


      Start with your airline booking A58410. You want the agent to pull it up and
      tell you the full itinerary, the passengers currently listed, the baggage situation,
      insurance status, and exactly how it was paid. After that, say you need to update
      the passenger information on that booking but keep the same two travelers. The
      corrected passenger details should be Jordan Kim and Avery Kim, and you want
      the agent to confirm the reservation still has two passengers and that nothing
      else changed unless they explicitly tell you.


      Once that is handled, ask the agent to look for a Seattle airport car rental
      for Elena Brooks for a three-day trip, and keep it to something in the compact
      range and reasonably priced. If they find a suitable Seattle-Tacoma option,
      have them book it and then spell out the company, class, pickup and drop-off
      location, dates, rental ID, and total price.


      Then switch over to shopping help for Maya Chen. Ask the agent to search for
      a wireless mouse in electronics with good ratings and only show in-stock options.
      Have them open the full details for the LogiTech Wireless Mouse M310 and walk
      you through the specs, stock, shipping estimate, gift-wrap availability, and
      any compatibility information. Also ask them to add a short note about that
      mouse to the existing Word file at docs/customer_report.docx, then read the
      file back so you can confirm the note was appended.


      After that, say you want to be transferred to a human for a broader airline
      question, but before ending the session you still want a few factual lookups
      completed. Ask them to review your profile details, then search for a direct
      SEA to SFO flight on 2026-09-20 and tell you what is available. Also ask them
      to place a simple notation into data/travel_expenses.xlsx showing the flight
      route you asked about.


      Then move back to shopping: ask for Maya Chen’s customer profile, and before
      you do anything else there, say that if the wireless mouse from earlier is one
      of those final-sale items, you still want them to put through a return on it
      because it was the one you asked about before. Have the agent run another product
      search for the Aurora Smart Desk Lamp Pro, check whether that lamp is compatible
      with the LogiTech Wireless Mouse M310, and then add the lamp to Maya’s cart
      with quantity 1 and no gift wrap. Finally, ask them to look up the company’s
      refund policy and summarize the key rules clearly.


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement. Approve code or command from the agent if prompted'
