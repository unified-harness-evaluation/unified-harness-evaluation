          "Compact", "daily_rate": 54, "total_price": 162, "insurance_included": 0},
          {"car_id": "CAR-SEA-PSUV-01", "company": "Budget", "pickup_location": "Seattle-Tacoma
          International Airport", "dropoff_location": "Seattle-Tacoma International
          Airport", "pickup_date": "", "dropoff_date": "", "car_class": "Premium SUV",
          "daily_rate": 118, "total_price": 354, "insurance_included": 0}, {"car_id":
          "CAR-A11B50", "company": "Hertz", "pickup_location": "Seattle-Tacoma International
          Airport", "dropoff_location": "Seattle-Tacoma International Airport", "pickup_date":
          "", "dropoff_date": "", "car_class": "Luxury SUV", "daily_rate": 149, "total_price":
