    - name: book_car_rental
      description: Book a car rental option returned by search_car_rentals for a customer.
      output:
        check: '{"status": "confirmed", "rental_id": "newly generated car rental ID",
          "car_id": "CAR-779F4F", "company": "Hertz", "car_class": "Compact", "total_price":
          162}'
    - name: get_user_reservations
      description: List all reservation IDs for a customer's flight bookings, hotel
        reservations, and car rentals. Use get_booking, get_hotel_reservation, or
        get_car_rental to look up details by ID.
      output:
        check: '{"user_id": "user_7144ff38", "booking_ids": [], "hotel_ids": ["HR-68D9"],
          "car_rental_ids": ["CR-68B7", "newly generated car rental ID"]}'
    - name: get_booking
      description: Retrieve the details of an existing booking by its booking ID.
      output:
        check: '{"booking_id": "F89008", "user_id": "user_4085661f", "flight_id":
          "", "status": "confirmed", "cabin_class": "economy", "seat_type": null,
          "meal_preference": null, "add_wifi": 0, "add_extra_legroom": 0, "add_insurance":
          "none", "price_paid": 0, "payment_method": "credit_card", "points_used":
          0, "cash_amount": 0, "booked_at": "2026-09-01T10:00:00", "cancellation_fee":
          null, "refund_amount": null, "change_fee": null, "fare_difference": null,
