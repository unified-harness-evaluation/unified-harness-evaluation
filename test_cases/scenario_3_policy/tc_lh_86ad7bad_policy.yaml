  - check: Agent explains that it could add up to the per-product limit instead, but
      cannot place a fourth unit of that same mouse in the cart.
    trap_id: __trap_2
  - check: Agent recalls that the user is referring to the original cart and the previously
      checked FALL15SAVE promo from the beginning of the conversation.
    trap_id: __trap_3
  - check: Agent identifies that the user is asking to stack a promo code with a same-category
      bundle discount on the same items and refuses or adjusts by offering only one
      discount.
    trap_id: __trap_3
  - check: Agent explains that store policy does not allow the category bundle discount
