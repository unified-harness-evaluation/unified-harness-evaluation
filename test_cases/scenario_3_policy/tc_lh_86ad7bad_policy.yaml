    - name: __trap_4
      position_in_full_chain: 19
      insert_after_real_step: 14
      recalled_entity: Evan Parker's shopping cart with validated FALL15SAVE promo
      recalled_details:
      - FALL15SAVE
      - cart subtotal 79
      - estimated discount 11.85
      recalls_from_step: 2
