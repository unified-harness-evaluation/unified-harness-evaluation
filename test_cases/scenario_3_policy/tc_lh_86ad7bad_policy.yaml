          "3 days", "gift_wrap_available": true, "backorder_available": false, "variants":
          []}'
    - name: get_variants
      description: List the variants (e.g. color, size) available for a product along
        with per-variant stock and effective price. Returns an empty list for products
        without variants. When a product has variants, add_to_cart REQUIRES a variant_id.
      output:
        check: '{"product_id": "PROD-FA0948", "product_name": "LogiTech Wireless Mouse
          M310", "base_price": 29, "variants": [], "note": "No variants available"}'
    - name: get_policies
      description: Look up the store's policy for a given topic. Returns a summary
        and a list of rules. Use when the customer's question or the scenario requires
        citing store policy.
      output:
        check: '{"topic": "exchange", "summary": "Exchanges must be for a different
          product, within the applicable return window, and cheaper exchanges refund
          the difference as store credit.", "rules": ["Must be a different product
          (self-swap not allowed, use process_return instead).", "Same price: no charge,
          no refund.", "More expensive: customer pays price difference.", "Cheaper:
          difference refunded as store credit (not original payment).", "Out of stock:
          issue store credit for the original item, do not complete exchange.", "Must
          be within return window (same rules as returns).", "No price protection
          on exchanges."]}'
    - name: search_products
      description: Search the task-local product catalog by free-text query. Returns
        ranked compact matches with product_id, name, matched_field, category, subcategory,
        and in_stock. Call get_product_details with a returned product_id for price,
        stock, warranty, and return-window details.
      output:
        check: '{"query": "canvas tote bag", "results": [{"product_id": "PROD-4ED2E3",
          "name": "Everyday Canvas Tote Bag", "matched_field": "name", "category":
          "accessories", "subcategory": "bags", "in_stock": true}]}'
    - name: process_exchange
      description: 'Exchange an item for a different product or variant. Two-step
        operation: first call without confirm to preview (price difference, eligibility),
        then call with confirm=true to execute. Requires prior call to get_policies(topic=''exchange'').'
      output:
        check: '{"status": "preview", "item_id": "ITEM-4D366B", "new_product_id":
          "PROD-4ED2E3", "new_item_id": null, "price_difference": -6, "customer_pays":
          0, "store_credit_refund": 6, "out_of_stock": false, "store_credit_amount":
