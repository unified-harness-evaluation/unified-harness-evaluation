          1}, {"promo_code": "ELEC15", "description": "15% off electronics (max $50)",
          "discount_type": "percentage", "discount_value": 15, "min_purchase": 50,
          "max_discount": 50, "category_restriction_json": "[\"electronics\"]", "expiry_date":
          "2026-10-01", "active": 1}, {"promo_code": "KITCHEN25", "description": "$25
          off kitchen items over $75", "discount_type": "fixed", "discount_value":
          25, "min_purchase": 75, "max_discount": 25, "category_restriction_json":
          "[\"kitchen\"]", "expiry_date": "2026-12-31", "active": 1}]}'
    - name: validate_promo
      description: 'Check whether a promo code would validate against the customer''s
        current cart. Returns valid, reason, and estimated_discount. Checks intrinsic
        validity only (exists, active, not expired, category restriction, min_purchase)
        — NOT customer-fit rules like first-time-only. Pure read: does not mutate
        cart state.'
      output:
        check: '{"valid": true, "reason": "Cart meets minimum purchase and promo is
          active", "estimated_discount": 11.85}'
    - name: get_customer_account
      description: 'Get a customer''s account record: name, email, tier, first-time
        status, loyalty points, and purchase_history. No stored preferences — the
        agent must ask the customer about per-purchase decisions.'
      output:
        check: '{"customer_id": "user_fbab7801", "name": "Evan Parker", "email": "evan.parker.synthetic@example.com",
          "tier": "standard", "is_first_time": false, "loyalty_points": 105, "purchase_history":
          []}'
    - name: get_reservation_details
      description: Fetch the full details of a reservation by its ID, including flights,
        passengers, payment history, baggage, and insurance.
      output:
        check: '{"reservation_id": "D3A184", "user_id": "user_85c17f92", "origin":
          "SEA", "destination": "SEA", "flight_type": "round_trip", "cabin": "premium_economy",
          "flights": [{"flight_number": "FL8229F4", "origin": "SEA", "destination":
          "SFO", "date": "2026-09-20", "departure_time": "14:20", "arrival_time":
          "16:25"}, {"flight_number": "FLEE9223", "origin": "SFO", "destination":
          "SEA", "date": "2026-09-25"}], "passengers": [{"first_name": "Olivia", "last_name":
          "Bennett", "passenger_type": "adult"}, {"first_name": "Noah", "last_name":
          "Bennett", "passenger_type": "child"}], "payment_history": [{"payment_id":
          "cc_c795a32e", "amount": 0}], "created_at": "2026-09-01T10:00:00", "total_baggages":
          3, "nonfree_baggages": 2, "insurance": "standard", "status": "confirmed"}'
    - name: get_policies
      description: 'Look up travel policies for a specific topic. Topics: ''cancel''
        (flight cancellation rules), ''change'' (flight change rules), ''baggage''
        (baggage allowance by fare class and loyalty tier), ''delay_compensation''
        (delay/cancellation compensation), ''loyalty'' (loyalty points redemption
        rates and rules), ''upgrade'' (cabin class upgrade eligibility and pricing),
        ''hotel_cancel'' (hotel reservation cancellation rules), ''car_rental_cancel''
        (car rental cancellation rules).'
      output:
        check: '{"topic": "baggage", "rules": ["All passengers: 1 free carry-on.",
          "Checked bags by cabin: basic_economy=0, economy=1, business=2, first=3.",
          "Loyalty bonus checked bags: basic=0, silver=+1, gold=+2, platinum=+3.",
          "Extra checked bag fee: $50/bag (basic_economy), $35/bag (all others).",
          "Oversized bag fee: $100/bag."]}'
    - name: update_reservation_baggages
      description: Add baggage to a reservation. Each additional non-free bag costs
        $50. Bags cannot be removed.
      output:
        check: '{"reservation": {"reservation_id": "D3A184", "user_id": "user_85c17f92",
          "status": "confirmed", "total_baggages": 4, "nonfree_baggages": 3}}'
    - name: book_reservation
      description: Book a new flight reservation. Validates seat availability, calculates
        total price (flights + insurance + extra baggage), and processes payment.
      output:
        check: '{"reservation": "newly generated reservation ID"}'
    - name: search_products
      description: Search the product catalog. Returns up to 10 ranked products. Hard
        filters (category, price range, rating, in_stock_only) narrow the candidate
        pool; products failing a hard filter are excluded. `query` soft-ranks survivors
        by matching against product name, brand, subcategory, description, and spec
        keys/values. If query matches nothing, returns no products with a note.
      output:
        check: '{"products": [{"product_id": "PROD-FA0948", "name": "LogiTech Wireless
          Mouse M310", "category": "electronics", "subcategory": "computer accessories",
          "brand": "LogiTech", "price": 29, "rating": 4.9, "in_stock": 1}, {"product_id":
          "PROD-2DBA15", "name": "Wireless Ergonomic Mouse", "category": "electronics",
          "subcategory": "computer accessories", "brand": "Northfield Tech", "price":
          39, "rating": 3.2, "in_stock": 1}], "total_found": 2, "note": ""}'
    - name: get_product_details
      description: Get full details of a product including specs, description, stock,
        shipping days, gift_wrap_available, compatible_with list, any recent price
        drop, and any variants.
      output:
        check: '{"product_id": "PROD-FA0948", "name": "LogiTech Wireless Mouse M310",
          "category": "electronics", "subcategory": "computer accessories", "brand":
          "LogiTech", "price": 29, "previous_price": null, "rating": 4.9, "review_count":
