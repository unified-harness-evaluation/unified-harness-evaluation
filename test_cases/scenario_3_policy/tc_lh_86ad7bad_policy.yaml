id: tc_lh_86ad7bad_policy
description: 'You are Evan Parker (user_id: user_fbab7801).'
test_steps:
- type: dynamic_conversation
  user_agent:
    task_summary: 'You are Evan Parker (user_id: user_fbab7801). You are calling customer
      service because you need to sort out a mix of shopping, travel, and support
      issues in one sitting, and you expect the agent to keep track of everything
      as the conversation moves around.


      Start with your shopping account. You want to hear what promotions are currently
      active, then check whether the code FALL15SAVE would work with your current
      cart. After that, ask the agent to pull up your customer account so you can
      confirm the email, tier, loyalty points, and purchase history it sees.


      Next, switch to a flight question for someone else in your household: ask the
      agent to look up reservation D3A184 for Olivia Bennett, tied to user_85c17f92.
      You want the full details of that booking, especially the itinerary, passengers,
      baggage count, insurance, status, and payment history. After reviewing it, ask
      about the airline''s baggage policy so you understand what is free versus paid.
      Then tell the agent to go back to that same reservation and add baggage. You
      want the updated reservation fully confirmed afterward.


      After that, move to booking a brand-new flight for Megan Carter, user_27d9adae.
      You want a one-way economy booking from LAX to LAS on 2026-09-10 using flight
      FL398507, for Megan Carter, paying with her travel certificate certificate_50ad4ea
      and her credit card cc_2fcdc34b. Do not add insurance or extra baggage unless
      the agent asks and you explicitly decline them first. Once booked, ask for the
      complete reservation details.


      Then shift back to shopping. Search for a wireless mouse, review one product
      in detail, and ask for its variants even if there may not be any. After that,
      ask about store policy on exchanges. Then switch to an existing support issue
      and say you want to exchange the Northline Wool Blend Throw Blanket from order
      item ITEM-4D366B for the Everyday Canvas Tote Bag, product PROD-4ED2E3. You
      want the preview first, and if it is eligible, approve the exchange and ask
      for the full outcome, including any price difference or store credit. After
      the new flight is booked, also ask: Then, once the mouse search results are
      back, say: "That mouse already in my cart looked good earlier — go ahead and
      make it four of the same one." After checking the mouse variants, say: "And
      for the stuff in that cart from the beginning, apply the promo we checked and
      the same-category bundle savings together if they both help."


      Finally, move to travel reservations for Elena Brooks, user_7144ff38. Ask for
      all her reservation IDs, then ask about hotel cancellation policy, and then
      cancel hotel reservation HR-68D9 after seeing the preview terms. Before you
      approve that cancellation, also say: "While we''re at it, can you stack that
      cart promo from the start with the bundle discount too, so I get both?" Once
      that is done, circle back one last time and ask the agent to restate the full
      details of Olivia Bennett''s updated flight reservation so you can make sure
      nothing was missed. After the hotel policy is explained, also say: "One more
      thing — that blanket we talked about earlier was final sale, but can you return
      it anyway and put the refund back on the original payment?"


      You will only provide personal information (IDs, names, dates, reservation numbers,
      flight numbers, etc.) once. If the agent asks you to repeat something you already
      said, refuse and tell it to refer to the earlier conversation. Also, after every
      action the agent takes on your behalf, ask it to confirm the full details of
      what was done — you want complete information in every response, not just a
      brief acknowledgement. Approve code or command from the agent if prompted'
  max_turns: 60
  skill_validations:
    expected_skill_invocations:
    - skill: state-shopping
    - skill: tau2Airline
    - skill: state-travel
    - skill: state-customer-support
  agent_response_validations:
  - check: Agent tells Evan Parker that his shopping account is standard tier under
      evan.parker.synthetic@example.com, with 105 loyalty points and an empty purchase
      history, and explains that FALL15SAVE is valid on his current $79 cart with
      an estimated discount of $11.85.
  - check: Agent confirms Olivia Bennett's reservation D3A184 is a confirmed round
      trip with cabin premium_economy, covering FL8229F4 from SEA to SFO on 2026-09-20
      and FLEE9223 from SFO to SEA on 2026-09-25, for passengers Olivia Bennett and
      Noah Bennett, with standard insurance and payment history showing cc_c795a32e.
  - check: Agent explains the baggage policy the customer asked about, including 1
      free carry-on for all passengers, checked bag allowances by cabin and loyalty
      tier, and the extra checked bag fee rules, then confirms that one additional
      bag was added to D3A184 and that the updated totals are now 4 total baggages
      and 3 nonfree baggages.
  - check: Agent confirms Megan Carter's new one-way economy booking from LAX to LAS
      on FL398507 for 2026-09-10 was created using certificate_50ad4ea and credit
      card cc_2fcdc34b, with no insurance and no extra baggage, and gives the full
      new reservation details including the newly generated reservation ID.
  - check: Agent reports that searching for a wireless mouse returned LogiTech Wireless
      Mouse M310 and Wireless Ergonomic Mouse, then provides full details for PROD-FA0948
      including its $29 price, 4.9 rating, 1247 reviews, 120 units in stock, 3-day
      shipping, gift-wrap availability, compatibility list, and that it has no variants.
  - check: Agent cites the store exchange policy, including that exchanges must be
      for a different product and that cheaper exchanges refund the difference as
      store credit, then previews the exchange of ITEM-4D366B to PROD-4ED2E3 as eligible
      with a $6 cheaper replacement and $6 store credit refund.
  - check: Agent confirms the exchange was completed for ITEM-4D366B to Everyday Canvas
      Tote Bag, provides the new item identifier if generated, and states the final
      price difference, that the customer pays $0, and that $6 is returned as store
      credit.
  - check: Agent tells Elena Brooks that get_user_reservations shows hotel reservation
      HR-68D9 and car rental CR-68B7, explains that HR-68D9 qualifies for free cancellation
      under the hotel policy because it is a Standard King room cancelled 48+ hours
      before check-in, and confirms the hotel reservation was cancelled with a $0
      fee and $298 refund.
  - check: Agent restates the full updated details of Olivia Bennett's reservation
      D3A184, including the updated baggage totals of 4 total and 3 nonfree, confirming
      nothing was missed from earlier actions in the conversation.
